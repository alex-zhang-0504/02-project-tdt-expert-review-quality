<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TDT考核系统 · 交互草稿 V1</title>
<style>
:root{--ink:#363636;--muted:#787878;--line:#e2e2e2;--surface:#f6f6f6;--accent:#0a9bf5;--soft:#e6f4fe;--radius:2px;--danger:#d44c47}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.65}button,input,select,textarea{font:inherit;color:var(--ink)}button{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:10px 18px;cursor:pointer;font-weight:600;transition:transform .18s,filter .18s}button:hover:not(:disabled){transform:translateY(-3px);filter:brightness(.96)}button:active:not(:disabled){transform:translateY(0)}button:disabled{cursor:not-allowed;color:var(--muted);background:var(--surface)}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button.ghost{background:#fff}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}input,select,textarea{border:1px solid #b8b8b8;border-radius:2px;background:white;padding:10px 12px;width:100%}textarea{resize:vertical;min-height:84px}label.field{display:grid;gap:6px}h1,h2,h3,p{margin:0}h1{font-size:22px;line-height:1.3}h2{font-size:28px;line-height:1.4}h3{font-size:18px}p+p{margin-top:8px}.muted{color:var(--muted)}.eyebrow{font-size:12px;letter-spacing:1px;color:var(--muted)}.app-header{border-bottom:1px solid var(--line);background:#fff;padding:20px 32px 16px}.header-row,.heading,.row{display:flex;align-items:center;justify-content:space-between;gap:20px}.identity{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:flex-end}.identity span{color:var(--ink)}.version{font-size:12px;background:var(--soft);padding:4px 10px;white-space:nowrap}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:18px}.tabs button{min-height:44px;padding:8px;display:flex;justify-content:center;align-items:center;gap:8px}.tabs button.active{background:var(--accent);border-color:var(--accent);color:white}.lock{width:15px;height:15px;flex:none}.shell{max-width:1260px;margin:0 auto;padding:28px 32px 36px}.draft-note{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:9px 32px;color:var(--muted);font-size:12px;background:var(--surface)}.draft-note strong{color:var(--ink);font-weight:500}.login{max-width:460px;margin:42px auto 60px;border:1px solid var(--line);padding:30px}.login form{display:grid;gap:20px;margin-top:24px}.login h2{font-size:25px}.login-error{min-height:24px}.list{margin-top:24px;display:grid;gap:14px}.assessment{border:1px solid var(--line);padding:22px 24px;border-radius:2px}.assessment p{margin-top:6px}.badge{font-size:13px;padding:3px 10px;background:var(--soft);white-space:nowrap}.list .details-row{display:flex;align-items:center;gap:18px;margin-top:16px}.progress{height:5px;background:var(--line);max-width:340px;flex:1}.progress>span{display:block;height:100%;background:var(--accent)}.pager{display:flex;justify-content:center;margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}.pager button{min-width:220px}.settings{border-top:1px solid var(--line);margin-top:26px;padding-top:18px}.settings summary{cursor:pointer}.settings-content{padding-top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.source{margin-top:22px;padding:22px;border:1px solid var(--line)}.source-tools{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;margin-top:14px}.scenarios{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:18px;font-size:13px}.scenarios input{width:auto;accent-color:var(--accent)}.scan{margin-top:22px}.scan-row{border-bottom:1px solid var(--line);padding:14px 0;display:flex;justify-content:space-between;gap:16px}.scan-row span:last-child{white-space:nowrap}.scanbar{height:4px;background:var(--line);margin-top:12px}.scanbar>span{height:100%;display:block;background:var(--accent);transition:width .3s}.exception{border:1px solid var(--line);padding:18px;margin-top:20px;color:var(--ink)}.error-label{color:var(--danger);font-weight:600}.exception .row{margin-top:12px}.exception select{max-width:360px}.roster{margin-top:24px;border-top:1px solid var(--line);padding-top:22px}.roster-upload{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin:18px 0}.roster-upload .file-name{text-align:left;font-weight:500}.roster-results{margin-top:14px;border-top:1px solid var(--line)}.roster-result{display:grid;grid-template-columns:80px 60px 1fr;gap:12px;border-bottom:1px solid var(--line);padding:10px 12px}.roster-result:first-child{background:var(--soft)}.roster-actions{display:flex;justify-content:flex-end;align-items:center;gap:16px;margin-top:20px;flex-wrap:wrap}.receipt{margin-top:16px;padding:14px 18px;background:var(--surface)}.receipt summary{cursor:pointer}.receipt code{font-size:12px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0}.metric{border:1px solid var(--line);padding:20px}.metric strong{font-size:28px;display:block}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;margin-top:22px;white-space:nowrap}th,td{padding:13px 16px;border:1px solid var(--line);text-align:left}th{background:var(--accent);color:white;font-weight:500}tbody tr:nth-child(even){background:var(--surface)}.questions{display:grid;gap:20px;margin-top:24px}.question{border:1px solid var(--line);padding:20px}.question h3{font-size:16px}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.option{border:1px solid var(--line);padding:13px;cursor:pointer;display:flex;align-items:center;gap:10px}.option:has(input:checked){border-color:var(--accent);background:var(--soft)}.option input{width:auto;accent-color:var(--accent)}.status{font-size:13px;color:var(--muted)}.review-top{display:flex;align-items:center;gap:12px;margin-top:16px}.review-top select{width:auto}.person{color:var(--ink)!important}.mini-note{font-size:13px;color:var(--muted);margin-top:12px}dialog{border:1px solid var(--line);border-radius:2px;padding:26px;max-width:760px;width:calc(100% - 48px);color:var(--ink)}dialog::backdrop{background:rgba(54,54,54,.22)}dialog textarea{min-height:320px;font:13px/1.6 Consolas,monospace;margin-top:16px}dialog .actions{display:flex;justify-content:flex-end;gap:12px;margin-top:16px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);max-width:90%;padding:12px 20px;background:var(--ink);color:#fff;z-index:10}.toast[hidden]{display:none}button.small{padding:6px 12px;font-size:13px}.info{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--ink);border-radius:50%;width:16px;height:16px;font-size:11px;margin-left:8px;cursor:help;vertical-align:middle}
@media(max-width:760px){.app-header{padding:16px}.header-row{align-items:flex-start;flex-direction:column;gap:12px}.identity{justify-content:flex-start;gap:12px;font-size:13px}.shell{padding:22px 16px}.draft-note{padding:8px 16px;align-items:flex-start}.tabs{gap:4px}.tabs button{font-size:13px}.heading{align-items:flex-start}.assessment{padding:18px}.assessment .row{align-items:flex-start}.roster-upload{grid-template-columns:1fr}.source-tools{grid-template-columns:1fr}.exception .row{flex-wrap:wrap}.options{grid-template-columns:1fr}.metrics{grid-template-columns:1fr}.login{margin:20px auto}.roster-result{grid-template-columns:70px 40px 1fr}.draft-note span{max-width:60%}}
@media(prefers-reduced-motion:reduce){button,.scanbar>span{transition:none}button:hover:not(:disabled){transform:none}}
</style>
</head>
<body>
<div class="draft-note"><strong>交互草稿 V1 · 待确认</strong><span>全部为虚拟数据，仅在本页模拟；刷新可重置。</span></div>
<header class="app-header" id="header"></header><main class="shell" id="main"></main>
<dialog id="config-dialog"><h2>账号配置预览</h2><p class="muted">修改仅在本次演示中生效，不会读写实际账号文件。</p><textarea id="config-json" aria-label="模拟账号配置"></textarea><p id="config-error" role="status"></p><div class="actions"><button data-action="close-config">取消</button><button class="primary" data-action="save-config">应用到演示</button></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lock='<svg class="lock" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="4" y="9" width="12" height="9" rx="1"/><path d="M6 9V6a4 4 0 018 0v3"/><path d="M10 12v3"/></svg>';
let accounts=[{employee_id:'0001',name:'虚拟管理员',role:'admin',enabled:true,owner_ids:['ou_demo_admin']},{employee_id:'1001',name:'虚拟项目经理甲',role:'project_manager',enabled:true,owner_ids:['ou_demo_a']},{employee_id:'1002',name:'虚拟项目经理乙',role:'project_manager',enabled:true,owner_ids:['ou_demo_b']}];
const state={user:null,page:'login',scenario:'normal',scanned:false,scanning:false,percent:0,bound:false,confirmed:false,policy:false,names:'虚拟评审人甲\n虚拟评审人乙',roster:null,expert:'虚拟评审人甲',manager:'1001',answers:{},objective:false,created:false};
const experts=['虚拟评审人甲','虚拟评审人乙'];
const modules=[['list','读取评审表'],['objective','客观数据评价'],['subjective','主观评价'],['total','总分统计']];
let timer,toastTimer;
function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,2600)}
function goto(page){state.page=page;render();window.scrollTo({top:0,behavior:'instant'})}
function completed(e,mid=state.manager){return Object.keys(state.answers[mid+'|'+e]||{}).length===6}
function roleName(u){return u.role==='admin'?'管理员':'项目经理'}
function render(){
 const u=state.user,admin=u?.role==='admin',isList=['list','my-list'].includes(state.page),active=['read','list'].includes(state.page)?'list':state.page==='my-list'?'subjective':state.page;
 $('#header').innerHTML=`<div class="header-row"><div><p class="eyebrow">TDT EXPERT REVIEW</p><h1>评审专家考核系统</h1></div><div class="identity">${u?`<span class="person">${esc(u.name)} · ${esc(u.employee_id)} · ${roleName(u)}</span>`:''}<span class="version">试用版 v0.6 · 模拟</span>${u&&isList?'<button class="ghost small" data-action="switch">切换身份</button>':''}</div></div>${u?`<nav class="tabs" aria-label="考核模块">${modules.map(([id,label])=>`<button ${!admin&&id!=='subjective'?'disabled aria-label="'+label+'，已锁定" title="仅管理员可操作"':''} class="${active===id?'active':''}" data-nav="${id}" ${active===id?'aria-current="page"':''}>${!admin&&id!=='subjective'?lock:''}${label}</button>`).join('')}</nav>`:''}`;
 $('#main').innerHTML=state.page==='login'?login():state.page==='list'?list():state.page==='read'?read():state.page==='my-list'?myList():state.page==='subjective'?subjective():state.page==='objective'?objective():total();
 if(state.page==='login'){updateLogin();$('#login-account').onchange=updateLogin;$('#login-form').onsubmit=loginSubmit}
 if(state.page==='read'){$('#roster-names')?.addEventListener('input',e=>{state.names=e.target.value;state.roster=null});document.querySelectorAll('[name=scenario]').forEach(r=>r.onchange=()=>{state.scenario=r.value;state.scanned=false;state.bound=false;state.confirmed=false;state.policy=false;render()})}
 if(state.page==='subjective'){document.querySelectorAll('[data-q]').forEach(r=>r.onchange=()=>{const key=state.manager+'|'+state.expert;(state.answers[key]||={})[r.dataset.q]=r.value;$('#save-status').textContent=`已自动保存（演示） · ${Object.keys(state.answers[key]).length}／6题`});$('#review-manager')?.addEventListener('change',e=>{state.manager=e.target.value;render()})}
}
function login(){return `<section class="login"><p class="eyebrow">本机工作区</p><h2>选择账号登录</h2><p class="muted">角色由账号配置决定。</p><form id="login-form"><label class="field">姓名与工号<select id="login-account">${accounts.filter(u=>u.enabled).map(u=>`<option value="${esc(u.employee_id)}">${esc(u.name)} · ${esc(u.employee_id)}</option>`).join('')}</select></label><div id="password-area"><label class="field">管理员密码<input type="password" id="login-password" autocomplete="off" placeholder="请输入演示密码" /></label><p class="mini-note">演示密码：<strong>demo123</strong>。这不是正式系统密码。</p></div><p id="login-hint" class="muted"></p><button class="primary" type="submit">进入系统</button><p id="login-error" class="login-error" role="status"></p></form></section>`}
function updateLogin(){const u=accounts.find(u=>u.employee_id===$('#login-account').value);$('#password-area').hidden=u?.role!=='admin';$('#login-password').required=u?.role==='admin';$('#login-hint').textContent=u?.role==='admin'?'管理员可操作全部模块。':'项目经理无需密码，仅可填写本人分配的主观问卷。';$('#login-error').textContent=''}
function loginSubmit(e){e.preventDefault();const u=accounts.find(u=>u.employee_id===$('#login-account').value);if(!u)return;if(u.role==='admin'&&$('#login-password').value!=='demo123'){$('#login-error').textContent='演示密码不正确，请输入 demo123。';return}state.user=u;state.manager=u.role==='admin'?'1001':u.employee_id;goto(u.role==='admin'?'list':'my-list')}
function pager(action,label){return `<div class="pager"><button class="primary" data-action="${action}">${label}</button></div>`}
function list(){return `<div class="heading"><div><p class="eyebrow">读取评审表 · 第1页</p><h2>考核列表</h2></div><span class="status">数据自动保存在本机（演示）</span></div><div class="list"><article class="assessment"><div class="row"><div><h3>2026年度评审专家考核${state.created?' · 新建演示':''}</h3><p class="muted">${state.confirmed?'2份报告 · 2位评审人 · 参数已固定':'2份报告 · 2位评审人 · 问卷填写中'}</p></div><button data-action="open-assessment">打开考核</button></div><div class="details-row"><span class="badge">进行中</span><span>项目经理已完成 ${experts.filter(e=>completed(e,'1001')).length}／2 份问卷</span><div class="progress"><span style="width:${experts.filter(e=>completed(e,'1001')).length*50}%"></span></div></div></article><article class="assessment"><div class="row"><div><h3>2026上半年评审专家考核</h3><p class="muted">8份报告 · 6位评审人 · 已确认结果</p></div><button data-action="history">查看结果</button></div></article></div><details class="settings"><summary>管理设置</summary><div class="settings-content"><button data-action="config">账号配置</button><button data-action="backup">备份全部数据</button><span class="muted">日常填写无需手动保存数据库。</span></div></details>${pager('new','新建考核 →')}`}
function read(){let bad=state.scanned&&state.scenario==='exception'&&!state.bound;return `<div class="heading"><div><p class="eyebrow">读取评审表 · 第2页</p><h2>读取与匹配</h2></div><span class="badge">${state.confirmed?'名单与参数已固定':'待确认'}</span></div><section class="source"><h3>飞书批量文件扫描</h3><div class="source-tools"><label class="field">飞书归档文件夹<input aria-label="飞书归档文件夹" value="https://example.feishu.cn/drive/folder/demo" /></label><button class="primary" data-action="scan" ${state.scanning||state.confirmed?'disabled':''}>${state.scanning?'正在扫描…':'模拟读取评审表'}</button></div><div class="scenarios"><span class="muted">试用场景</span><label><input type="radio" name="scenario" value="normal" ${state.scenario==='normal'?'checked':''} ${state.scanning?'disabled':''}/> 全部owner ID已配置</label><label><input type="radio" name="scenario" value="exception" ${state.scenario==='exception'?'checked':''} ${state.scanning?'disabled':''}/> 有一个owner ID未配置</label></div>${state.scanning?`<div class="scanbar"><span style="width:${state.percent}%"></span></div><p class="mini-note" id="scan-progress">正在读取 ${state.percent}%</p>`:''}${state.scanned?`<div class="scan"><div class="scan-row"><span>虚拟低功耗项目 · TDR1评审报告</span><span>检查通过</span></div><div class="scan-row"><span>虚拟通信项目 · TDR3评审报告</span><span>检查通过</span></div><p class="mini-note">已读取2份报告。${bad?'项目经理归属有1项待确认。':'项目经理已按owner ID自动匹配。'}</p></div>`:''}${bad?`<section class="exception"><span class="error-label">1项待确认</span><h3>项目经理匹配异常</h3><p class="person">虚拟项目经理乙 · ou_demo_new</p><p class="muted">该ID未登记，涉及2份报告。选择一次后建立固定关联。</p><div class="row"><select id="bind-account" aria-label="异常owner ID对应账号"><option value="">请选择对应账号</option>${accounts.filter(u=>u.enabled).map(u=>`<option value="${esc(u.employee_id)}">${esc(u.name)} · ${esc(u.employee_id)}</option>`).join('')}</select><button data-action="bind">确认归属</button></div></section>`:''}</section>${state.scanned?roster():''}${pager('back-list','← 返回考核列表')}`}
function roster(){return `<section class="roster"><h3>考核评审人名单<span class="info" tabindex="0" title="只考核名单与已读取报告的交集">!</span></h3><div class="roster-upload"><span>导入名单 Excel（含姓名列）</span><button class="file-name" data-action="sample-roster" ${state.confirmed?'disabled':''}>TDT技术项目评审人员名单.xlsx（示例）</button><button data-action="match" ${state.confirmed?'disabled':''}>手动匹配名单</button></div><label class="field"><strong>待考核姓名</strong><textarea id="roster-names" ${state.confirmed?'disabled':''}>${esc(state.names)}</textarea></label>${state.roster?`<div class="roster-results">${[['已匹配',state.roster.matched],['未匹配',state.roster.unmatched],['未纳入',experts.filter(e=>!state.roster.matched.includes(e))]].map(([title,names])=>`<div class="roster-result"><strong>${title}</strong><span>${names.length}人</span><span class="person">${esc(names.join('、')||'无')}</span></div>`).join('')}</div>`:''}<div class="roster-actions"><span class="status">${state.policy?'评分参数已读取并固定 · V0.9':'确认时自动读取并校验评分参数'}</span><button class="primary" data-action="confirm-roster" ${state.confirmed||state.scenario==='exception'&&!state.bound?'disabled':''}>${state.confirmed?'名单已确认':'确认名单并开始考核'}</button></div>${state.policy?receipt():''}</section>`}
function receipt(){return '<details class="receipt"><summary>评分参数已固定 · V0.9 · 查看读取凭据</summary><p>客观30分＋主观70分，阶段权重4∶2∶4。</p><p class="muted">配置快照仅用于此次模拟考核；正式版本以实际配置为准。</p><code>config/scoring-policy-v0.1.json · 模拟读取成功</code></details>'}
function match(){const names=[...new Set(state.names.split(/[\s、,，;；]+/).filter(Boolean))];state.roster={matched:names.filter(n=>experts.includes(n)),unmatched:names.filter(n=>!experts.includes(n))}}
function myList(){return `<div class="heading"><div><p class="eyebrow">主观评价 · 我的任务</p><h2>我的问卷</h2><p class="muted">2026年度评审专家考核 · 仅显示与你的项目有关的评审人</p></div><span class="status">${experts.filter(e=>completed(e)).length}／2 已完成</span></div><div class="list">${experts.map((e,i)=>`<article class="assessment"><div class="row"><div><h3 class="person">${e}</h3><p class="muted">${i?'虚拟通信项目 · TDR3':'虚拟低功耗项目 · TDR1、TDR2'}</p></div><button class="primary" data-expert="${e}">${completed(e)?'查看／修改问卷':'填写问卷'}</button></div><p class="status">${completed(e)?'已保存 · 6／6题':'待完成 · '+Object.keys(state.answers[state.manager+'|'+e]||{}).length+'／6题'}</p></article>`).join('')}</div>`}
function subjective(){const ratings=state.answers[state.manager+'|'+state.expert]||{};return `<div class="heading"><div><p class="eyebrow">主观评价 · 问卷填写</p><h2 class="person">${esc(state.expert)}</h2></div><span class="status" id="save-status">${Object.keys(ratings).length?'已保存（演示）':'填写后自动保存（演示）'} · ${Object.keys(ratings).length}／6题</span></div>${state.user.role==='admin'?`<div class="review-top"><label for="review-manager">评价归属项目经理</label><select id="review-manager">${accounts.filter(u=>u.role==='project_manager').map(u=>`<option value="${esc(u.employee_id)}" ${state.manager===u.employee_id?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div>`:'<p class="muted">只评价共同项目中实际观察到的表现。本页题目为交互示例。</p>'}<div class="questions">${['评审准备','问题识别','专业建议','沟通协作','跟进支持','突出贡献'].map((q,i)=>`<section class="question"><h3>${i+1}．${q}</h3><div class="options">${(i===5?['有突出贡献','无突出贡献']:['表现充分','基本符合','需要改进']).map((option,j)=>`<label class="option"><input type="radio" name="q${i}" data-q="${i}" value="${j}" ${ratings[i]===String(j)?'checked':''}/><span>${option}</span></label>`).join('')}</div></section>`).join('')}</div>${pager(state.user.role==='admin'?'back-list':'my-list',state.user.role==='admin'?'← 返回考核列表':'← 返回我的问卷')}`}
function objective(){return `<div class="heading"><div><p class="eyebrow">客观数据评价</p><h2>客观评分</h2><p class="muted">以下为演示数据，不调用AI或读取真实报告。</p></div><button class="primary" data-action="score">${state.objective?'重新模拟评分':'模拟自动评分'}</button></div><div class="metrics"><div class="metric"><span class="muted">报告数量</span><strong>2</strong></div><div class="metric"><span class="muted">考核评审人</span><strong>2</strong></div><div class="metric"><span class="muted">处理状态</span><strong style="font-size:22px">${state.objective?'已完成':'待计算'}</strong></div></div><div class="table-wrap"><table><thead><tr><th>评审人</th><th>基础得分</th><th>意见超额得分</th><th>有效对策得分</th><th>客观总得分</th></tr></thead><tbody>${experts.map((e,i)=>`<tr><td class="person">${e}</td><td>${state.objective?22-i:'—'}</td><td>${state.objective?2:'—'}</td><td>${state.objective?3:'—'}</td><td>${state.objective?27-i:'—'}</td></tr>`).join('')}</tbody></table></div>${receipt()}`}
function total(){return `<div class="heading"><div><p class="eyebrow">总分统计</p><h2>考核结果</h2><p class="muted">演示结果仅用于预览布局与权限。</p></div><button data-action="export">导出演示结果</button></div><div class="table-wrap"><table><thead><tr><th>评审人</th><th>客观得分</th><th>主观得分</th><th>结果状态</th></tr></thead><tbody>${experts.map((e,i)=>`<tr><td class="person">${e}</td><td>${state.objective?27-i:'待完成'}</td><td>${completed(e,'1001')?'58（演示）':'待填写'}</td><td>${state.objective&&completed(e,'1001')?'可确认（演示）':'暂定'}</td></tr>`).join('')}</tbody></table></div>`}
function download(name,value,type='application/json'){const url=URL.createObjectURL(new Blob([value],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.nav){goto(b.dataset.nav==='subjective'&&state.user.role!=='admin'?'my-list':b.dataset.nav);return}if(b.dataset.expert){state.expert=b.dataset.expert;goto('subjective');return}switch(b.dataset.action){
case 'switch':state.user=null;goto('login');break;
case 'new':clearInterval(timer);state.scanning=false;state.scanned=false;state.confirmed=false;state.policy=false;state.roster=null;state.created=true;state.bound=false;goto('read');break;
case 'open-assessment':state.scanned=true;goto('read');break;
case 'back-list':goto('list');break;
case 'my-list':goto('my-list');break;
case 'history':goto('total');toast('正在查看历史演示结果');break;
case 'scan':state.scanning=true;state.percent=0;state.scanned=false;render();clearInterval(timer);timer=setInterval(()=>{state.percent+=25;if(state.percent>=100){clearInterval(timer);state.scanning=false;state.scanned=true;if(state.scenario==='normal')state.bound=true;if(state.page==='read')render()}else if(state.page==='read'){$('.scanbar>span').style.width=state.percent+'%';$('#scan-progress').textContent='正在读取 '+state.percent+'%'}},260);break;
case 'bind':{const u=accounts.find(u=>u.employee_id===$('#bind-account').value);if(!u){toast('请先选择对应账号');break}if(!u.owner_ids.includes('ou_demo_new'))u.owner_ids.push('ou_demo_new');state.bound=true;render();toast('已建立固定关联，2份报告一起完成匹配（演示）');break}
case 'sample-roster':state.names=experts.join('\n');match();render();toast('已导入示例名单');break;
case 'match':match();render();break;
case 'confirm-roster':match();if(!state.roster.matched.length){render();toast('至少需要一位匹配的评审人');break}state.policy=true;state.confirmed=true;goto('objective');toast('评分参数读取成功，名单与参数快照已固定（演示）');break;
case 'score':state.objective=true;render();toast('模拟客观评分完成');break;
case 'config':$('#config-json').value=JSON.stringify({version:1,users:accounts},null,2);$('#config-error').textContent='';$('#config-dialog').showModal();break;
case 'close-config':$('#config-dialog').close();break;
case 'save-config':try{const data=JSON.parse($('#config-json').value);const users=data.users;if(!Array.isArray(users)||!users.some(u=>u.enabled&&u.role==='admin'))throw Error('至少保留一个启用的管理员');if(new Set(users.map(u=>u.employee_id)).size!==users.length||users.some(u=>!u.name||typeof u.employee_id!=='string'||!['admin','project_manager'].includes(u.role)||!Array.isArray(u.owner_ids)))throw Error('请检查工号、姓名、角色及owner_ids');accounts=users;state.user=accounts.find(u=>u.employee_id===state.user.employee_id&&u.enabled);$('#config-dialog').close();if(!state.user)goto('login');else goto(state.user.role==='admin'?'list':'my-list');toast('已应用模拟账号配置')}catch(err){$('#config-error').textContent=err.message}break;
case 'backup':download('TDT模拟备份-draft-v1.json',JSON.stringify({draft:true,accounts,answers:state.answers},null,2));toast('已下载模拟数据备份');break;
case 'export':download('TDT模拟结果-draft-v1.csv','\ufeff评审人,结果状态\n虚拟评审人甲,演示结果\n虚拟评审人乙,演示结果','text/csv;charset=utf-8');break;
}});
render();
</script>
</body></html>
