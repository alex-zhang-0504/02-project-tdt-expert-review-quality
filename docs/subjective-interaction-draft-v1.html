<div id="subjective-draft-v1">
  <style>
    #subjective-draft-v1 { --tdt-blue:#0a9bf5; --tdt-soft:#e6f4fe; background:#fff; color:#363636; font:14px/1.65 "Microsoft YaHei",sans-serif; position:relative; padding:24px; border:1px solid #e2e2e2; }
    #subjective-draft-v1 * { box-sizing:border-box; }
    #subjective-draft-v1 h2 { margin:0; font-size:26px; color:#000; }
    #subjective-draft-v1 h3 { margin:0 0 12px; font-size:18px; }
    #subjective-draft-v1 button { font:inherit; padding:10px 16px; border:1px solid #e2e2e2; background:#f7f7f7; color:#000; }
    #subjective-draft-v1 .sd-head,#subjective-draft-v1 .sd-person { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
    #subjective-draft-v1 .sd-primary { background:var(--tdt-blue); color:#fff; border-color:var(--tdt-blue); }
    #subjective-draft-v1 .sd-work { display:grid; grid-template-columns:145px 1fr; gap:24px; margin-top:24px; }
    #subjective-draft-v1 aside { border-right:1px solid #e2e2e2; padding-right:16px; }
    #subjective-draft-v1 aside button { width:100%; margin-top:10px; text-align:left; }
    #subjective-draft-v1 aside .sd-current { background:var(--tdt-soft); border-color:var(--tdt-blue); }
    #subjective-draft-v1 .sd-person { justify-content:flex-start; margin-bottom:20px; }
    #subjective-draft-v1 .sd-person strong { color:#000; font-size:20px; }
    #subjective-draft-v1 .sd-boundary { margin:8px 0 16px; color:#000; }
    #subjective-draft-v1 .sd-options { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    #subjective-draft-v1 .sd-option { text-align:left; display:flex; gap:10px; padding:16px; align-items:flex-start; }
    #subjective-draft-v1 .sd-option[aria-pressed="true"] { border-color:var(--tdt-blue); background:var(--tdt-soft); }
    #subjective-draft-v1 .sd-mark { border:1px solid #888; width:16px; height:16px; border-radius:50%; flex-shrink:0; margin-top:4px; }
    #subjective-draft-v1 [aria-pressed="true"] .sd-mark { border:5px solid var(--tdt-blue); }
    #subjective-draft-v1 .sd-option strong { display:block; margin-bottom:6px; }
    #subjective-draft-v1 .sd-option small { font-size:13px; color:#363636; }
    #subjective-draft-v1 .sd-reason { margin-top:14px; }
    #subjective-draft-v1 textarea { width:100%; padding:10px; min-height:72px; font:inherit; border:1px solid #bbb; background:#fff; color:#000; }
    #subjective-draft-v1 .sd-footer { text-align:center; padding-top:22px; margin-top:22px; border-top:1px solid #e2e2e2; }
    #subjective-draft-v1 .sd-overlay { position:absolute; inset:0; background:#0005; display:grid; place-items:center; padding:24px; z-index:2; }
    #subjective-draft-v1 .sd-modal { background:#fff; width:min(610px,100%); padding:28px; box-shadow:0 10px 35px #0002; }
    #subjective-draft-v1 .sd-modal p { margin:12px 0; color:#000; }
    #subjective-draft-v1 .sd-modal footer { text-align:center; margin-top:24px; }
    #subjective-draft-v1 [hidden] { display:none; }
    @media(max-width:650px) { #subjective-draft-v1 {padding:16px;} #subjective-draft-v1 .sd-work {grid-template-columns:1fr;} #subjective-draft-v1 aside {display:none;} #subjective-draft-v1 .sd-options {grid-template-columns:1fr;} #subjective-draft-v1 .sd-modal {padding:18px;} }
  </style>
  <header class="sd-head"><div><span>步骤 3</span><h2>主观评价</h2></div><button class="sd-primary" type="button" disabled>导出评价结果</button></header>
  <div class="sd-work">
    <aside><span>评价经理：虚拟经理甲</span><button type="button" class="sd-current">虚拟专家甲</button><button type="button" disabled>虚拟专家乙</button></aside>
    <section>
      <div class="sd-person"><strong>虚拟专家甲</strong><button type="button" disabled>查看评审过程详情</button></div>
      <h3>1．评审准备与重点把握</h3>
      <p>回顾本考核周期，该专家在相关评审中，对本专业关键评审议题的把握通常表现如何？</p>
      <p class="sd-boundary">职责边界：评价准备是否转化为重点把握；材料未提供等外部原因不直接归责于专家。</p>
      <div class="sd-options">
        <button type="button" class="sd-option" aria-pressed="false"><span class="sd-mark"></span><span><strong>能够聚焦关键议题</strong><small>在多数相关评审中，能结合项目目标、技术方案及关键约束，识别本专业需要重点审查的事项，使讨论聚焦关键问题。</small></span></button>
        <button type="button" class="sd-option" aria-pressed="false"><span class="sd-mark"></span><span><strong>能够完成常规审查</strong><small>通常了解必要背景和材料，能够完成本专业常规审查；对关键议题的提炼或优先顺序，有时需要进一步提示。</small></span></button>
        <button type="button" class="sd-option" aria-pressed="false"><span class="sd-mark"></span><span><strong>存在明显准备或理解不足</strong><small>在已获得必要材料的情况下，多次因准备不足或理解偏差，使评审明显偏离关键议题，影响有效审查。</small></span></button>
        <button type="button" class="sd-option" aria-pressed="false" data-unable><span class="sd-mark"></span><span><strong>暂无法判断</strong><small>缺少足够的观察或可核实记录，暂不能判断本项表现。请填写原因，此项不计入有效评分。</small></span></button>
      </div>
      <label class="sd-reason" hidden>无法判断的原因<textarea placeholder="请说明信息不足的原因"></textarea></label>
      <p class="sd-status" aria-live="polite">本题未选</p>
    </section>
  </div>
  <footer class="sd-footer"><button type="button" class="sd-primary" disabled>查看主观打分</button></footer>
  <div class="sd-overlay">
    <section class="sd-modal" role="dialog" aria-modal="true" aria-labelledby="sd-guide-title">
      <h3 id="sd-guide-title">主观评价填写说明</h3>
      <p>请回顾本考核周期内，您直接参与或有记录可核实的共同评审活动。前五题选择相关职责和实际履职机会下的通常表现，不只依据最近、最突出或最不满意的一次经历；第六题单独核验突出贡献。</p>
      <p>依据评审当时可获得的信息与专业职责判断，不因结论严格、意见未采纳或项目最终成败直接认定表现。信息不足请选择暂无法判断。本页范围为本次导入报告。</p>
      <footer><button type="button" class="sd-primary" data-known>已知</button></footer>
    </section>
  </div>
</div>
<script>
(() => {
  const root = document.getElementById('subjective-draft-v1');
  const overlay = root.querySelector('.sd-overlay');
  const options = Array.from(root.querySelectorAll('.sd-option'));
  root.querySelector('[data-known]').addEventListener('click', () => { overlay.hidden = true; options[0].focus(); });
  options.forEach(button => button.addEventListener('click', () => {
    const select = button.getAttribute('aria-pressed') !== 'true';
    options.forEach(option => option.setAttribute('aria-pressed', String(option === button && select)));
    root.querySelector('.sd-reason').hidden = !(select && button.hasAttribute('data-unable'));
    root.querySelector('.sd-status').textContent = select ? '已选：' + button.querySelector('strong').textContent : '本题未选';
  }));
})();
</script>
