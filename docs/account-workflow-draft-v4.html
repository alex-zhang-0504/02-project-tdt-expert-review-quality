<style>
/* Selected presentation rules copied from main. */
.score-table { border-collapse: collapse; width: 100%; table-layout: fixed; font-size: var(--font-size-body); }
.score-table th, .score-table td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 12px 10px; text-align: left; vertical-align: middle; }
.score-table tbody th { overflow-wrap: anywhere; }

.score-table thead th { background: var(--accent); color: var(--accent-ink); border-right-color: var(--head-cell-line); }
.score-table tbody tr:nth-child(even) { background: var(--surface-soft); }
.score-table tbody th { border-right-color: var(--line-strong); }
.score-table small { display: block; color: var(--muted); font-weight: var(--font-weight-body); font-size: var(--font-size-micro); overflow-wrap: anywhere; }
.dimension-one-controls { min-width: 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
.dimension-one-controls > * { min-width: 0; }
.dimension-one-controls > .field { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 8px; }
.dimension-one-controls > .field > span, .dimension-one-export .field > span { white-space: nowrap; }
.dimension-one-export { display: flex; flex: 1 1 480px; align-items: center; gap: 8px; flex-wrap: wrap; }
.dimension-one-export .field { flex: 1 1 210px; min-width: 0; }
.dimension-one-export .field { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 8px; }
.dimension-one-export button { flex: 0 0 auto; white-space: nowrap; }
.dimension-one-table { width: max(100%, var(--dimension-table-width)); min-width: var(--dimension-table-width); border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: var(--font-size-supporting); }
.dimension-one-table th { position: sticky; top: 0; z-index: 5; height: 44px; padding: 9px 10px; border-right: 1px solid var(--head-cell-line); border-bottom: 1px solid var(--head-cell-line); background: var(--accent); color: var(--accent-ink); font-weight: var(--font-weight-heading); text-align: center; white-space: nowrap; }

.evidence-drawer { width: min(1120px, calc(100% - 40px)); max-width: calc(100% - 40px); box-sizing: border-box; min-width: 0; margin: auto; max-height: 90vh; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--ink); }

.evidence-drawer-heading h3 { min-width: 0; overflow-wrap: anywhere; }
.evidence-drawer-heading > div { min-width: 0; }
.evidence-drawer-heading > button { flex-shrink: 0; }
.dimension-one-controls { display: grid; grid-template-columns: 250px minmax(280px, 1fr); align-items: stretch; }
.dimension-one-export { display: contents; }
.facts-table .row-evidence-button { background: var(--accent-soft); border: 1px solid var(--accent); color: var(--ink); font-weight: 600; }
.review-stage .needs-confirmation { background: var(--warning-bg); border-left: 3px solid var(--warning); padding: 12px; margin: 10px 0; }

.objective-table-footer .policy-settings-button svg { width: 14px; height: 14px; }

<script>

let accounts=[{employee_id:'0001',name:'虚拟管理员',role:'admin',enabled:true,owner_ids:['ou_demo_admin']},{employee_id:'1001',name:'虚拟项目经理甲',role:'project_manager',enabled:true,owner_ids:['ou_demo_a']},{employee_id:'1002',name:'虚拟项目经理乙',role:'project_manager',enabled:true,owner_ids:['ou_demo_b']}];
const state={user:null,page:'login',scenario:'normal',scanned:false,scanning:false,percent:0,bound:false,confirmed:false,policy:false,names:'虚拟评审人甲\n虚拟评审人乙',roster:null,expert:'虚拟评审人甲',manager:'1001',answers:{},objective:false,created:false};
const questionnairePolicy={"version":"4","instructions":"请回顾本考核周期内，你与该评审人共同参与的项目评审。前五题看他平时的表现，不只看最近一次或印象最深的一次；第六题看有没有具体的突出贡献。不了解或没有足够依据时，选择暂无法判断，不要把不了解当作表现不好。","unable":{"title":"暂无法判断","description":"我对他这方面的表现了解不够，或现有记录不足，无法作出判断。","reason_prompt":"请说明原因，不作为低档评价。"},"contribution_prompt":"哪个项目？他具体做了什么？带来了什么重要变化？有什么记录可以证明？","dimensions":[{"id":"preparation","title":"评审准备与重点把握","prompt":"回顾本考核周期，在你参加的项目评审中，该评审人能否抓住本专业需要重点讨论的问题？","boundary":"看讨论中能否抓住重点，并充分讨论。不以发言快慢或多少来判断；材料未提供等外部原因，不直接归责于评审人。","options":[{"id":"high","title":"能抓住重点","description":"大多数时候，了解项目目标、技术方案和主要限制，能抓住本专业最需要关注的问题，让讨论围绕重点展开。"},{"id":"medium","title":"能完成基本评审","description":"通常了解项目背景和资料，能完成本专业的基本评审；但哪些问题最关键、应该先讨论什么，有时需要别人提醒。"},{"id":"low","title":"准备或理解不足","description":"在已收到必要资料的情况下，多次因不了解项目或理解错误，抓不住重点、明显偏离议题，影响评审。"}]},{"id":"judgment","title":"风险辨识与专业判断","prompt":"回顾本考核周期，该评审人能否发现评审技术中的重要风险，并说清楚为什么这样判断、可能造成什么影响？","boundary":"看判断是否有依据，不只看提出了多少条意见，并要结合看在项目结束、落地产品、或截止目前是否获得了相关实践。","options":[{"id":"high","title":"能发现重要风险，并说明依据","description":"大多数时候，能发现重要风险，说清判断依据、可能影响和哪些需要优先处理；拿不准的地方也会明确说明，帮助团队作出决定。"},{"id":"medium","title":"能发现常见问题，判断基本合理","description":"通常能发现常见问题，判断基本合理；但为什么这样判断、影响有多大或哪个更紧急，有时还需要进一步追问。"},{"id":"low","title":"漏掉重要风险，或作出无依据的重要判断","description":"对本专业负责、且当时信息已足够判断的事项，多次漏掉应当发现的重要风险，或缺少依据，却作出影响项目决策的重要判断。"}]},{"id":"guidance","title":"技术建议与方案指导","prompt":"回顾本考核周期，遇到需要他提供专业建议的问题时，该评审人能否提出具体、可行的做法，让团队知道下一步怎么做？","boundary":"只评价需要他提供专业建议的事项。看建议是否合理、能否实施，并且被采纳为标准，但不要求他替研发团队完成全部方案。","options":[{"id":"high","title":"建议具体，能指导下一步行动","description":"大多数时候，能提出具体做法，说明什么条件下适用，并考虑项目的时间、成本或技术限制，让团队知道下一步怎么改、怎么验证。"},{"id":"medium","title":"方向合理，具体做法还需补充","description":"通常能指出合理的改进方向，但具体怎么做、什么条件下能用，有留白，需要团队进一步明确。"},{"id":"low","title":"建议空泛，或明显行不通","description":"对确实需要其专业建议的问题，多次只说“要优化”“再完善”，没有具体指导；或忽略已知限制，提出明显无法执行的建议。"}]},{"id":"verification","title":"验证证据与评审把关","prompt":"回顾本考核周期，在需要他检查验证结果、确认问题是否解决时，该评审人能否核对证据，判断是否可以通过？","boundary":"只评价他负责检查或确认的事项。项目团队没有按时解决问题，不直接算作他把关不到位；本期没有承担这类任务，也不按表现不足处理。","options":[{"id":"high","title":"能明确通过要求，并核对证据","description":"大多数时候，能根据当前评审阶段，说清要验证什么、达到什么要求才算通过；会核对证据是否支持结论，不足时要求补充。"},{"id":"medium","title":"能检查主要结果，发现明显不足","description":"通常会检查主要验证结果，对明显不符合要求或材料缺失的情况，能提出补充要求。"},{"id":"low","title":"证据没核清就通过，或随意改要求","description":"对自己负责确认的事项，多次未核实关键证据就同意通过；或没有新的事实依据，却随意更改通过要求。"}]},{"id":"collaboration","title":"专业表达与评审担当","prompt":"回顾本考核周期，该评审人能否对自己负责的问题给出明确判断，并在意见不一致时，围绕事实把问题讨论清楚？","boundary":"不以是否好相处、是否赞同项目团队来判断。意见严格、坚持不同意见或最终没有达成一致，不直接算协作差。","options":[{"id":"high","title":"能说明理由，也能处理分歧","description":"通常能说清理由，在分歧中把事实和问题讲清楚，推动形成明确的评审结论。有依据时坚持意见，出现新证据时也愿意调整判断。"},{"id":"medium","title":"能表达意见，完成自己的专业判断","description":"通常能说清自己的意见、配合讨论，并对自己负责的问题作出明确判断；遇到复杂分歧，还需要他人帮助协调。"},{"id":"low","title":"回避应作出的判断，或妨碍讨论","description":"对需要自己作出判断的问题，多次回避或不表态；或用没有依据的说法阻碍讨论，影响形成明确结论。"}]},{"id":"contribution","title":"可核实的突出技术贡献","prompt":"本考核周期内，该评审人是否在你的项目中，作出过明显超出日常评审要求的贡献，而且有具体事例和证据可以说明？","boundary":"普通建议被采纳，不直接算突出贡献；没有突出贡献，也不代表日常评审做得不好。一件符合条件的贡献即可，不要求多次发生。预计能带来的好处，要与已经实现的结果分开说明。","options":[{"id":"high","title":"有突出贡献，能提供依据","description":"能说清他具体做了什么，因此避免了什么关键问题或带来了什么明显改善，并提供证据。例如，推动重大技术风险得到有效处理、解决关键技术难题，或使技术方案明显改善。"},{"id":"low","title":"未发现符合条件的突出贡献","description":"在你了解的项目中，未发现达到上述标准、且有证据支持的贡献。这个选项不代表他的日常评审表现不合格。"}]}],"scores":{"preparation":{"high":10,"medium":7,"low":2},"judgment":{"high":15,"medium":10,"low":0},"guidance":{"high":15,"medium":10,"low":0},"verification":{"high":10,"medium":7,"low":0},"collaboration":{"high":10,"medium":7,"low":0},"contribution":{"high":10,"low":0}}};

function requiresEvidence(id,option){return id==='contribution'?option==='high':id!=='preparation'&&option==='low'}
function answerProgress(e,mid=state.manager){const ratings=state.answers[mid+'|'+e]||{};let valid=0,selected=0;for(const d of questionnairePolicy.dimensions){const r=ratings[d.id];if(!r)continue;const allowed=d.options.some(o=>o.id===r.option)||(d.id!=='contribution'&&r.option==='unable');if(!allowed)continue;selected++;if(r.option==='unable'){if(r.reason?.trim())valid++}else if(requiresEvidence(d.id,r.option)){const rows=(r.evidence||[]).filter(x=>x.project_code||x.note?.trim());if(rows.length&&rows.every(x=>commonProjects(e,mid).some(p=>p.code===x.project_code)&&x.note?.trim()))valid++}else valid++}return {valid,selected}}
function completed(e,mid=state.manager){return answerProgress(e,mid).valid===6}
function commonProjects(e=state.expert,mid=state.manager){const names=mid==='1002'?(e===experts[0]?['虚拟散热优化项目','虚拟可靠性项目']:['虚拟通信项目','虚拟连接稳定性项目']):(e===experts[0]?['虚拟低功耗项目','虚拟通信项目','虚拟平台升级项目','虚拟续航优化项目','虚拟音频降噪项目','虚拟显示优化项目','虚拟结构验证项目','虚拟连接稳定性项目']:['虚拟通信项目','虚拟显示优化项目']);return names.map((name,i)=>({code:`DEMO-${mid}-${experts.indexOf(e)+1}-${i+1}`,name}))}
function currentRatings(){return state.answers[state.manager+'|'+state.expert]||={}}
function saveIndicator(){if(!$('#save-status'))return;const p=answerProgress(state.expert);const label=`已保存 · ${p.valid}／6题${p.selected>p.valid?' · 待补依据或原因':''}`;$('#save-status').textContent=label;$('#subjective-completion').textContent=p.valid===6?'6／6题 · 已完成':`${p.valid}／6题 · 待完成`;$('#subjective-completion-bar').value=p.valid;const rail=$('#admin-rail-progress');if(rail){const names=assessmentExperts();rail.textContent=`已完成 ${names.filter(e=>completed(e)).length}／${names.length}人`;document.querySelectorAll('[data-admin-person]').forEach(b=>{const e=b.dataset.adminPerson;b.querySelector('span').textContent=completed(e)?'已完成':answerProgress(e).selected?'待完成':'待评价'})}}

function visibleFactGroups(value) {
  return value === "overall" ? ["全部阶段"] : ["TDR1", "TDR2", "TDR3"].includes(value) ? [value] : ["TDR1", "TDR2", "TDR3"];
}
function factCellText(stats, key) {
  if (stats.expected === 0) return "—";
  if (key === "proxy_rate") return stats.proxy + "/" + stats.expected;
  if (stats.unknown && ["attendance_rate", "opinion_average"].includes(key)) return "待确认";
  if (key === "opinion_average") return stats[key] == null ? "—" : Number(stats[key]).toFixed(1);
  if (key.endsWith("_rate")) return percent(stats[key]);
  if (key === "solutions" && stats.pending) return "待识别";
  return String(stats[key]);
}
function subtaskDisplayName(name) {
  const separator = name.indexOf("-");
  return separator < 0 ? name : name.slice(separator + 1).trim() || name;
}

function renderOpinion(o, session, index) {
  const labels = {pending: "待AI识别", yes: "包含", no: "不包含", suspected: "疑似"};
  const unresolved = o.ai_status === 'suspected' && o.included == null;
  const selection = unresolved ? null : (o.included ?? (o.ai_status === 'yes'));
  const excerpt = o.excerpt === o.text ? "见上述意见" : o.excerpt;
  let html = '<article class="opinion-record' + (unresolved ? ' needs-confirmation' : '') + '"><p class="opinion-text"><strong>意见' + (index + 1) + '：</strong>' + escapeHtml(o.text) + '</p>';
  html += '<p class="opinion-text"><strong>对策：</strong>' + labels[o.ai_status]
    + (excerpt ? '（' + escapeHtml(excerpt) + '）' : '')
    + (o.ai_status !== 'pending' ? ' · ' + (unresolved ? '待人工确认，暂未计入' : selection ? '计入统计' : '不计入统计') : '') + '</p>';
  if (o.reason) html += '<p>判定说明：' + escapeHtml(o.reason) + '</p>';
  if (o.ai_status !== "pending") html += '<div class="solution-actions" aria-label="是否计入对策统计">'
    + [true, false].map(include => '<button type="button" class="secondary-button" data-opinion="' + o.opinion_id
      + '" data-include="' + include + '" aria-pressed="' + (selection === include)
      + '">' + (include ? '计入统计' : '不计入统计') + '</button>').join("") + '</div>';
  if (o.audit.length) {
    const latest = o.audit[o.audit.length - 1];
    const date = new Date(latest.at);
    const time = Number.isNaN(date.getTime()) ? '时间不可用' : date.toLocaleString('zh-CN', {hour12: false});
    html += '<p class="muted">最近修改：' + escapeHtml(time) + '</p>';
  }
  if (o.rule_version) html += '<p class="muted">识别版本：' + escapeHtml(o.rule_version) + '</p>';
  return html + '</article>';
}


const objectiveFilter = {analysisId: null, names: null};

function objectiveReviewers() {
  if (objectiveFilter.analysisId !== state.analysis?.analysis_id) {
    objectiveFilter.analysisId = state.analysis?.analysis_id;
    objectiveFilter.names = null;
  }
  const included = state.analysis?.assessment?.included;
  return (state.analysis?.experts || []).filter(e => !included || included.includes(e.expert_name));
}
function objectiveReviewerVisible(name) {
  return objectiveFilter.names === null || objectiveFilter.names.has(name);
}
function objectiveReviewerHeader() {
  const all = objectiveReviewers();
  const selected = all.filter(e => objectiveReviewerVisible(e.expert_name)).length;
  return `<button type="button" class="reviewer-filter-trigger" data-reviewer-filter aria-haspopup="dialog">评审人 <span aria-hidden="true">▾</span><small>${selected === all.length ? '全部' : '已选' + selected + '人'}</small></button>`;
}
function refreshObjectiveFilter() {
  renderDimensionOneTable();
  const scoreHost = document.querySelector('#objective-page-two');
  scoreHost.querySelectorAll('tbody tr[data-reviewer]').forEach(row => {
    row.hidden = !objectiveReviewerVisible(row.dataset.reviewer);
  });
  scoreHost.querySelectorAll('thead th:first-child').forEach(th => th.innerHTML = objectiveReviewerHeader());
  const empty = scoreHost.querySelector('[data-reviewer-empty]');
  if (empty) empty.hidden = !!objectiveReviewers().some(e => objectiveReviewerVisible(e.expert_name));
}
function matchingReviewerChoices() {
  const query = document.querySelector('#reviewer-filter-search').value;
  return objectiveReviewers().filter(e => reviewerMatchesSearch(e, query));
}
function updateReviewerSelectAll() {
  const experts = matchingReviewerChoices();
  const selected = experts.filter(e => objectiveReviewerVisible(e.expert_name)).length;
  const checkbox = document.querySelector('#reviewer-filter-all');
  checkbox.checked = experts.length > 0 && selected === experts.length;
  checkbox.indeterminate = selected > 0 && selected < experts.length;
  checkbox.disabled = experts.length === 0;
  document.querySelector('#reviewer-filter-count').textContent = experts.length + '人';
}
function renderReviewerChoices() {
  const experts = matchingReviewerChoices();
  document.querySelector('#reviewer-filter-list').innerHTML = experts.map(e => `<label><input type="checkbox" value="${escapeHtml(e.expert_name)}" ${objectiveReviewerVisible(e.expert_name) ? 'checked' : ''} /><span>${escapeHtml(e.expert_name)}</span></label>`).join('') || '<p>没有匹配的评审人。</p>';
  updateReviewerSelectAll();
}
document.addEventListener('click', event => {
  const dialog = document.querySelector('#reviewer-filter-dialog');
  const trigger = event.target.closest('[data-reviewer-filter]');
  if (trigger) {
    const rect = trigger.getBoundingClientRect();
    document.querySelector('#reviewer-filter-search').value = '';
    renderReviewerChoices();
    dialog.show();
    dialog.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - dialog.offsetWidth - 8)) + 'px';
    dialog.style.top = Math.max(8, Math.min(rect.bottom + 4, window.innerHeight - dialog.offsetHeight - 8)) + 'px';
    document.querySelector('#reviewer-filter-search').focus();
    return;
  }
  if (event.target.closest('[data-reviewer-filter-close]') || (dialog.open && !dialog.contains(event.target))) dialog.close();
});
document.addEventListener('input', event => {
  if (event.target.id === 'reviewer-filter-search') renderReviewerChoices();
});
document.addEventListener('change', event => {
  if (!event.target.matches('#reviewer-filter-list input, #reviewer-filter-all')) return;
  if (objectiveFilter.names === null) objectiveFilter.names = new Set(objectiveReviewers().map(e => e.expert_name));
  const names = event.target.id === 'reviewer-filter-all' ? matchingReviewerChoices().map(e => e.expert_name) : [event.target.value];
  names.forEach(name => {
    if (event.target.checked) objectiveFilter.names.add(name);
    else objectiveFilter.names.delete(name);
  });
  refreshObjectiveFilter();
  renderReviewerChoices();
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') document.querySelector('#reviewer-filter-dialog').close();
});

function normalizedReviewerSearch(value) {
  return value.toLocaleLowerCase("zh-CN").replace(/\s+/g, "");
}

function reviewerMatchesSearch(expert, search) {
  const keywords = search.trim().split(/\s+/).filter(Boolean).map(normalizedReviewerSearch);
  const candidates = [expert.expert_name, expert.expert_name_pinyin].filter(Boolean).map(normalizedReviewerSearch);
  return !keywords.length || keywords.some(keyword => candidates.some(candidate => candidate.includes(keyword)));
}

function objective(){if(!activeTask()||!state.confirmed)return `<h2>客观数据评价</h2><p>请先读取报告并确认考核评审人名单。</p>`;return `<section id="objective-shell"><div class="heading"><div><p class="eyebrow">步骤 2</p><h2>客观数据评价</h2></div><button class="primary" data-action="export-objective">导出评价结果</button></div><div id="objective-page-one" ${objectivePage===2?'hidden':''}><div class="dimension-one-controls"><label class="field"><span>统计视图</span><select id="dimension-one-stage">${[['','分阶段'],['overall','全部阶段汇总'],['TDR1','仅TDR1'],['TDR2','仅TDR2'],['TDR3','仅TDR3']].map(([v,n])=>`<option value="${v}" ${stageView===v?'selected':''}>${n}</option>`).join('')}</select></label><button data-action="identify">对策有效性识别</button></div><div class="dimension-one-table-wrap" id="dimension-one-table-wrap"></div><div class="objective-table-footer"><p class="table-symbol-note">「—」表示本批次无应参记录或该项不适用；「0」表示有统计依据，但数量为零。</p></div></div><div id="objective-page-two" ${objectivePage===1?'hidden':''}></div><div class="objective-table-footer parameter-entry"><button class="small" data-action="parameters">${lock} 评分参数</button></div>${pager('objective-toggle',objectivePage===1?'查看客观评分 →':'← 返回数据统计')}</section>`}
function buildAnalysis(){const people=assessmentExperts().map((name,i)=>{const count=commonProjects(name).length;const stages={};for(const stage of ['TDR1','TDR2','TDR3'])stages[stage]={expected:count,attended:count,signed:count,opinions:count,solutions:state.objective?1:0,attendance_rate:100,signoff_rate:100,opinion_average:1,proxy:0,unknown:0,pending:!state.objective,suspected:0};const sessions=commonProjects(name).flatMap((p,index)=>['TDR1','TDR2','TDR3'].map(stage=>({project_code:p.code,project_name:p.name,stage,attendance:'已参加',attended:true,signoff:'G',opinions:[{opinion_id:p.code+'-'+stage,text:'建议补充边界条件下的稳定性验证，并明确验收要求。',ai_status:state.objective?(index===0?'yes':'no'):'pending',included:state.opinionDecisions?.[p.code+'-'+stage]??(state.objective&&index===0),excerpt:'增加边界条件验证',reason:state.objective?'包含可执行验证措施（虚拟识别结果）。':'',audit:[],rule_version:'demo-v4'}]})));for(const stage of ['TDR1','TDR2','TDR3'])stages[stage].solutions=sessions.filter(s=>s.stage===stage).flatMap(s=>s.opinions).filter(o=>o.included).length;return {expert_name:name,expert_name_pinyin:i?'xunipingshenrenyi':'xunipingshenrenjia',stages,overall:{expected:count*3,attended:count*3,signed:count*3,opinions:count*3,solutions:Object.values(stages).reduce((sum,s)=>sum+s.solutions,0),attendance_rate:100,signoff_rate:100,opinion_average:1,proxy:0,unknown:0,pending:!state.objective,suspected:0},sessions}});return {analysis_id:activeTaskId,experts:people,sessions:people.flatMap(e=>e.sessions)}}
function makeTableScrollable(el){el.classList.add('table-scroll-content');el.tabIndex=0;el.setAttribute('role','region');el.setAttribute('aria-label','可横向滚动的表格')}
function demoObjectiveValues(name){const analysis=buildAnalysis();const e=analysis.experts.find(e=>e.expert_name===name);const tier=[...new Set(analysis.experts.map(e=>e.overall.attended))].sort((a,b)=>b-a);const participation=e.overall.attended<3?0:tier.indexOf(e.overall.attended)===0?5:tier.indexOf(e.overall.attended)===1?3:0;const reward=e.overall.solutions*2;return [25,25,25,25,participation,25+participation,0,reward,25+participation+reward]}
function mountObjective(){if(!state.confirmed)return;state.analysis=buildAnalysis();elements={dimensionOneStage:$('#dimension-one-stage'),dimensionOneTableWrap:$('#dimension-one-table-wrap'),analysisSummary:document.createElement('span'),evidenceDrawer:$('#evidence-drawer'),evidenceDrawerTitle:$('#evidence-drawer-title'),evidenceDrawerContent:$('#evidence-drawer-content')};renderDimensionOneTable();$('#dimension-one-stage').onchange=e=>{stageView=e.target.value;renderDimensionOneTable();};const headers=['评审人','TDR1／25','TDR2／25','TDR3／25','阶段加权／25','参与度／5','基础得分','评审意见超额得分','输出有效对策得分','客观总得分'];$('#objective-page-two').innerHTML=`<div class="table-wrap"><table class="score-table"><thead><tr>${headers.map((h,i)=>`<th>${i===0?objectiveReviewerHeader():esc(h)}</th>`).join('')}</tr></thead><tbody>${assessmentExperts().map((e,i)=>`<tr data-reviewer="${esc(e)}" ${objectiveReviewerVisible(e)?'':'hidden'}><td class="person">${esc(e)}</td>${demoObjectiveValues(e).map(n=>`<td>${state.objective?n:'待识别'}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="status">客观总得分包含全部奖励，可超过基础分；待识别项不按零处理。</p>`;}
function openReviewDetails(){state.analysis=buildAnalysis();if(state.user.role!=='admin'){const allowed=new Set(commonProjects().map(p=>p.code));state.analysis.experts=state.analysis.experts.filter(e=>e.expert_name===state.expert).map(e=>({...e,sessions:e.sessions.filter(s=>allowed.has(s.project_code))}))}elements.evidenceDrawer=$('#evidence-drawer');elements.evidenceDrawerTitle=$('#evidence-drawer-title');elements.evidenceDrawerContent=$('#evidence-drawer-content');openDimensionOneEvidence(state.expert);if(state.user.role!=='admin')elements.evidenceDrawerContent.querySelectorAll('.solution-actions').forEach(el=>el.remove())}
function selectSolution(id,included){if(state.user?.role!=='admin')return;const o=state.analysis?.experts.flatMap(e=>e.sessions).flatMap(s=>s.opinions).find(o=>o.opinion_id===id);if(o){(state.opinionDecisions||={})[id]=included;o.included=included;saveActiveTask();o.audit.push({at:new Date().toISOString()});openDimensionOneEvidence(evidenceExpertName);toast('已更新虚拟统计，关闭详情后可查看。')}}
function exportRows(rows,name){download(name,'\ufeff评审人,客观总得分,主观最终分,总分\n'+rows.map(r=>[r.name,r.objective??'',r.subjective??'',r.total??''].join(',')).join('\n'),'text/csv;charset=utf-8');toast('已导出演示CSV；正式系统沿用Excel导出。')}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;if(b.dataset.task){const t=tasks.find(t=>t.id===b.dataset.task);if(t.done)openHistory(t);else{selectTask(t);goto('read')}return}if(b.dataset.close){$('#'+b.dataset.close).close();if(b.dataset.close==='delete-task-dialog')pendingDeleteId=null;if(b.dataset.close==='evidence-drawer'&&state.page==='objective')mountObjective();return}if(b.dataset.resultDetail){const rows=b.dataset.history==='true'?historyTask.rows:currentResults();const r=rows[Number(b.dataset.resultDetail)];$('#formula-title').textContent=r.name+' · 计分依据';$('#formula-body').innerHTML=`<p>客观总得分${r.objective??'待完成'}＋主观最终分${r.subjective??'待完成'}，总分${r.total??'待统计'}。</p><p>本页为${b.dataset.history==='true'?'历史任务快照':'当前任务'}虚拟数据。</p>`;showModal('formula-dialog');return}switch(b.dataset.action){
case 'create-next':createTask();break;
case 'sample-accounts':creation.users=validateRoster({version:1,users:accounts});creation.error='';render();break;
case 'review-details':openReviewDetails();break;
case 'to-read':goto('read');break;
case 'objective-toggle':objectivePage=objectivePage===1?2:1;render();break;
case 'identify':showModal('identify-dialog');break;
case 'run-identify':$('#identify-dialog').close();state.objective=true;saveActiveTask();render();toast('演示识别已完成，未调用AI服务。');break;
case 'parameters':$('#formula-title').textContent='评分参数';$('#formula-body').innerHTML=receipt();showModal('formula-dialog');break;
case 'export-current':exportRows(currentResults(),'当前任务-演示结果.csv');break;
case 'export-objective':download('客观评价-演示.csv','\ufeff评审人,应参场次,实参场次,已会签场次,意见条数,含对策意见条数,客观总得分\n'+assessmentExperts().map((e,i)=>[e,commonProjects(e).length*3,commonProjects(e).length*3,commonProjects(e).length*3,commonProjects(e).length*3,state.objective?demoObjectiveValues(e)[7]/2:'待识别',state.objective?demoObjectiveValues(e).at(-1):'待识别'].join(',')).join('\n'),'text/csv;charset=utf-8');toast('已导出演示CSV；正式导出沿用main的两张Excel工作表。');break;
}});
function assessmentExperts(){return state.confirmed?(state.roster?.matched||experts):[]}
function invalidateScope(){state.confirmed=false;state.objective=false;state.roster=null;state.analysis=null;state.opinionDecisions={};objectiveFilter.names=null;saveActiveTask()}
function confirmScope(){if(!activeTask()||!state.scanned||state.scanning||(state.scenario==='exception'&&!state.bound)){toast('请先完成报告读取及项目经理匹配。');return}match();if(!state.roster.matched.length){render();toast('至少需要一位匹配的评审人');return}if(!state.policy){state.policy=true;saveActiveTask();render();toast('评分参数已读取，核对后点击下一步。');return}state.confirmed=true;saveActiveTask();goto('objective');toast('已按当前报告与名单更新考评范围，沿用本任务评分参数。')}
function roster(){return `<section class="roster"><h3>考核评审人名单<span class="info" tabindex="0" title="只考核名单上的评审人">!</span></h3><div class="roster-upload"><span>导入名单 Excel（含姓名列）</span><button class="file-name" data-action="sample-roster">TDT技术项目评审人员名单.xlsx（示例）</button><button data-action="match">手动匹配名单</button><button data-action="sample-roster">还原导入名单</button></div><label class="field"><strong>待考核姓名</strong><textarea id="roster-names">${esc(state.names)}</textarea></label><div id="roster-result" role="status">${state.roster?`<div class="roster-results">${[['已匹配',state.roster.matched],['未匹配',state.roster.unmatched],['未纳入',experts.filter(e=>!state.roster.matched.includes(e))]].map(([title,names])=>`<div class="roster-result"><strong>${title}</strong><span>${names.length}人</span><span class="person">${esc(names.join('、')||'无')}</span></div>`).join('')}</div>`:''}</div><div class="assessment-actions"><button class="primary" id="continue-analysis" data-action="confirm-roster" ${state.scanning||state.scenario==='exception'&&!state.bound?'disabled':''}>${state.policy?'下一步':'读取评分参数'}</button><div id="assessment-policy">${state.policy?'<span class="status">本任务评分参数已读取 · V0.9</span>':'评分参数尚未读取。'}</div></div>${state.policy?receipt():''}</section>`}
function list(){saveActiveTask();return `<div class="heading"><h2>考核任务信息</h2></div><div class="task-grid"><button class="task-card new-task" data-action="new"><span class="plus">＋</span><strong>新建考评任务</strong></button>${[...tasks].sort((a,b)=>b.createdAt-a.createdAt).map(t=>{const p=t.done?null:taskProgress(t);return `<article class="task-entry"><button type="button" class="task-card" data-task="${t.id}"><span class="row"><strong class="task-title">${esc(t.title)}</strong><span class="badge">${t.done?'已完成':'进行中'}</span></span>${t.done?`<span class="task-meta">${t.reportCount}份报告 · ${t.rows.length}位评审人 · 已确认结果</span><span class="task-meta">完成时间：${t.finished}</span>`:`<span class="task-meta">${t.data.scanned?'报告已读取':'报告待读取'} · ${(t.data.roster?.matched||experts).length}位评审人 · ${taskManagers(t).length}位项目经理</span><span class="task-progress"><span>客观数据评价</span><span>${t.data.objective?'已完成':t.data.confirmed?'待对策识别与评分':t.data.scanned?'待确认名单':'待读取报告'}</span></span><span class="progress"><span style="width:${t.data.objective?100:t.data.confirmed?50:t.data.scanned?25:0}%"></span></span><span class="task-progress"><span>主观评价</span><span>${t.data.confirmed?p.done:0}／${p.total}份问卷已完成${t.data.confirmed?'':' · 待确认范围'}</span></span><span class="progress"><span style="width:${t.data.confirmed&&p.total?p.done/p.total*100:0}%"></span></span>`}</button><button type="button" class="task-delete small" data-delete-task="${t.id}" aria-label="删除${esc(t.title)}">删除</button></article>`}).join('')}</div>`}
function requestDeleteTask(id){const t=tasks.find(t=>t.id===id);if(!t)return;pendingDeleteId=id;$('#delete-task-name').textContent=t.title;showModal('delete-task-dialog')}
function deleteTask(){if(state.user?.role!=='admin')return;const i=tasks.findIndex(t=>t.id===pendingDeleteId);if(i<0)return;const id=tasks[i].id;tasks.splice(i,1);if(activeTaskId===id){clearInterval(timer);activeTaskId=null;Object.assign(state,{scanned:false,scanning:false,confirmed:false,policy:false,roster:null,objective:false,answers:{},opinionDecisions:{},analysis:null});objectiveFilter.names=null}if(historyTask?.id===id)historyTask=null;pendingDeleteId=null;$('#delete-task-dialog').close();goto('list');toast('已删除此演示任务及其关联数据。')}
function subjective(){if(!activeTask()||!state.confirmed)return '<h2>主观评价</h2><p>请先读取报告并确认考核评审人名单。</p>';if(!assessmentExperts().includes(state.expert))state.expert=assessmentExperts()[0];if(state.user.role!=='admin')return questionnaireEditor();const managers=taskManagers();if(!managers.some(u=>u.employee_id===state.manager))state.manager=managers[0]?.employee_id||'';const names=assessmentExperts();if(!names.includes(state.expert))state.expert=names[0];return `<div class="heading"><div><p class="eyebrow">步骤 3 · 维度二</p><h2>主观评价</h2></div><button class="primary" data-action="export-subjective">导出评价结果</button></div>${subjectivePage===1?`<div class="subjective-layout"><aside class="subjective-rail" aria-label="选择项目经理和评审人"><label class="field"><span>评价项目经理</span><select id="review-manager">${managers.map(u=>`<option value="${esc(u.employee_id)}" ${u.employee_id===state.manager?'selected':''}>${esc(u.name)} · ${esc(u.employee_id)}</option>`).join('')}</select></label><p class="muted rail-progress" id="admin-rail-progress">已完成 ${names.filter(e=>completed(e)).length}／${names.length}人</p><div id="subjective-experts">${names.map(e=>`<button type="button" class="subjective-person" data-admin-person="${esc(e)}" aria-pressed="${e===state.expert}"><strong class="person">${esc(e)}</strong><span>${completed(e)?'已完成':answerProgress(e).selected?'待完成':'待评价'}</span></button>`).join('')}</div></aside><div class="subjective-content">${questionnaireEditor()}</div></div>`:subjectiveScores()}${pager('subjective-toggle',subjectivePage===1?'查看主观打分 →':'← 返回问卷')}`}
function validRating(d,r,name,mid){if(!r)return false;if(r.option==='unable')return d.id!=='contribution'&&!!r.reason?.trim();if(!d.options.some(o=>o.id===r.option))return false;if(!requiresEvidence(d.id,r.option))return true;const rows=(r.evidence||[]).filter(e=>e.project_code||e.note?.trim());return rows.length>0&&rows.every(e=>e.note?.trim()&&commonProjects(name,mid).some(p=>p.code===e.project_code))}
function subjectiveRows(){return assessmentExperts().map(name=>{const items=questionnairePolicy.dimensions.map(d=>{const values=taskManagers().map(u=>({r:state.answers[u.employee_id+'|'+name]?.[d.id],mid:u.employee_id})).filter(({r,mid})=>validRating(d,r,name,mid)&&r.option!=='unable').map(({r})=>questionnairePolicy.scores[d.id][r.option]);return {score:values.length?+(d.id==='contribution'?Math.max(...values):values.reduce((a,b)=>a+b,0)/values.length).toFixed(2):null,count:values.length}});const count=taskManagers().filter(u=>completed(name,u.employee_id)).length;const provisional=items.some(i=>i.score!==null)?+items.reduce((sum,i)=>sum+(i.score??0),0).toFixed(2):null;return {name,items,completed:count,expected:taskManagers().length,provisional,total:count===taskManagers().length&&items.every(i=>i.score!==null)?provisional:null}})}
function subjectiveScores(){const text=n=>n==null?'—':n;return `<div class="note-row">平均规则<span class="info" tabindex="0" title="前五题按各题有效评价等权平均，无法判断不计入分母；贡献取有效最高分。未全部回应或某题无有效评价时，最终分留空。">!</span></div><div class="table-wrap"><table class="score-table"><thead><tr>${['评审人',...questionnairePolicy.dimensions.map(d=>d.title),'最终分／70','暂定平均','完成／应评价'].map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${subjectiveRows().map(r=>`<tr><td class="person">${esc(r.name)}</td>${r.items.map(i=>`<td>${text(i.score)}（${i.count}人）</td>`).join('')}<td>${text(r.total)}</td><td>${text(r.provisional)}</td><td>${r.completed}／${r.expected}</td></tr>`).join('')}</tbody></table></div>`}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;if(b.dataset.deleteTask){requestDeleteTask(b.dataset.deleteTask);return}if(b.dataset.adminPerson){state.expert=b.dataset.adminPerson;render();return}switch(b.dataset.action){case 'delete-task-confirm':deleteTask();break;case 'subjective-toggle':subjectivePage=subjectivePage===1?2:1;render();break;case 'export-subjective':download('主观评价-演示.csv','\ufeff评审人,主观最终分,暂定平均,完成问卷,应评价问卷\n'+subjectiveRows().map(r=>[r.name,r.total??'',r.provisional??'',r.completed,r.expected].join(',')).join('\n'),'text/csv;charset=utf-8');toast('已导出演示主观结果，页面选择不裁减任务范围。');break}});
render();
</script>
