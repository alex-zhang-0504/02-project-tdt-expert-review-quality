ansform:translateY(-3px);filter:brightness(.94)}.card:active{transform:translateY(0) scale(.98);filter:brightness(.88)}.card:focus-visible{outline:2px solid var(--ink);outline-offset:4px}.card-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.person-name{font-size:18px;font-weight:700;color:var(--ink);background:#fff;padding:3px 9px;border-radius:2px}.badge{font-size:13px;border:1px solid #ffffff80;padding:3px 8px;border-radius:2px;white-space:nowrap}.done .badge{background:#fff;color:#286044;border-color:#fff;font-weight:600}.card-bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end}.count{font-size:28px;line-height:1.1}.count small{font-size:14px}.save-label{display:block;font-size:13px;margin-top:7px}.arrow{font-size:24px}.segments{display:flex;gap:5px;margin-top:-10px}.segments i{height:3px;flex:1;background:#ffffff40}.segments i.filled{background:#fff}.compact{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.compact .card{min-height:158px;padding:18px;gap:19px}.compact .person-name{font-size:16px}.compact .count{font-size:24px}.group-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.group-grid .card{min-height:142px;padding:20px;gap:16px}.group-title{font-size:17px;font-weight:600;margin:28px 0 14px}.group-title:first-child{margin-top:0}.group-title span{font-size:14px;color:var(--muted);font-weight:400;margin-left:10px}.question-page{background:white;padding:28px;border:1px solid var(--line)}.question-page .subjective-heading{margin-bottom:28px}.question-page .subjective-heading h3{font-size:24px}.question-page .subjective-heading .saved{margin-left:auto;color:var(--muted);font-size:14px}.question-page .assessment-pager{margin-bottom:0}.question-page .field{margin-top:12px}.question-page .field textarea{min-height:66px}.logged-out{max-width:480px;margin:64px auto;background:white;border:1px solid var(--line);padding:36px}.logged-out h2{margin-top:0}.demo-dialog{max-width:650px;border:1px solid var(--line);padding:28px;color:var(--ink);border-radius:2px}.demo-dialog::backdrop{background:var(--backdrop)}.demo-dialog .dialog-actions{display:flex;justify-content:flex-end;margin-top:24px}

<div class="demo-bar"><div class="demo-row"><strong>我的问卷 · 视觉方案</strong><button class="variant" data-variant="a" aria-pressed="true">A · 三列均衡（推荐）</button><button class="variant" data-variant="b" aria-pressed="false">B · 四列紧凑</button><button class="variant" data-variant="c" aria-pressed="false">C · 完成状态分组</button></div><p class="demo-note" id="design-note">三列卡片，适合日常查看；整张卡片均可点击。此页仅保存虚拟演示数据。</p></div>
<header class="product-head"><div class="head-inner"><div class="head-row"><div class="brand"><small>TDT EXPERT REVIEW</small><h1>评审人考核系统</h1></div><div class="identity"><span>虚拟项目经理 · 1001 · 项目经理</span><button id="logout" class="ghost-button head-chip">退出登录</button><span class="head-chip version">试用版 v0.6</span></div></div><nav class="module-tabs"><button class="module-tab" disabled>🔒 读取评审表</button><button class="module-tab" disabled>🔒 客观数据评价</button><button class="module-tab is-active" id="home">主观评价</button><button class="module-tab" disabled>🔒 总分统计</button></nav></div></header>
<main class="main" id="app"></main><dialog class="demo-dialog" id="dialog"><h2 id="dialog-title"></h2><div id="dialog-content"></div><div class="dialog-actions"><button class="primary-button" id="close-dialog">已知</button></div></dialog>
<script id="questionnaire-data" type="application/json">{
  "version": "4",
  "instructions": "请回顾本考核周期内，你与该评审人共同参与的项目评审。前五题看他平时的表现，不只看最近一次或印象最深的一次；第六题看有没有具体的突出贡献。不了解或没有足够依据时，选择暂无法判断，不要把不了解当作表现不好。",
  "unable": {
    "title": "暂无法判断",
    "description": "我对他这方面的表现了解不够，或现有记录不足，无法作出判断。",
    "reason_prompt": "请说明原因，不作为低档评价。"
  },
  "contribution_prompt": "哪个项目？他具体做了什么？带来了什么重要变化？有什么记录可以证明？",
  "dimensions": [
    {
      "id": "preparation",
      "title": "评审准备与重点把握",
      "prompt": "回顾本考核周期，在你参加的项目评审中，该评审人能否抓住本专业需要重点讨论的问题？",
      "boundary": "看讨论中能否抓住重点，并充分讨论。不以发言快慢或多少来判断；材料未提供等外部原因，不直接归责于评审人。",
      "options": [
        {
          "id": "high",
          "title": "能抓住重点",
          "description": "大多数时候，了解项目目标、技术方案和主要限制，能抓住本专业最需要关注的问题，让讨论围绕重点展开。"
        },
        {
          "id": "medium",
          "title": "能完成基本评审",
          "description": "通常了解项目背景和资料，能完成本专业的基本评审；但哪些问题最关键、应该先讨论什么，有时需要别人提醒。"
        },
        {
          "id": "low",
          "title": "准备或理解不足",
          "description": "在已收到必要资料的情况下，多次因不了解项目或理解错误，抓不住重点、明显偏离议题，影响评审。"
        }
      ]
    },
    {
      "id": "judgment",
      "title": "风险辨识与专业判断",
      "prompt": "回顾本考核周期，该评审人能否发现评审技术中的重要风险，并说清楚为什么这样判断、可能造成什么影响？",
      "boundary": "看判断是否有依据，不只看提出了多少条意见，并要结合看在项目结束、落地产品、或截止目前是否获得了相关实践。",
      "options": [
        {
          "id": "high",
          "title": "能发现重要风险，并说明依据",
          "description": "大多数时候，能发现重要风险，说清判断依据、可能影响和哪些需要优先处理；拿不准的地方也会明确说明，帮助团队作出决定。"
        },
        {
          "id": "medium",
          "title": "能发现常见问题，判断基本合理",
          "description": "通常能发现常见问题，判断基本合理；但为什么这样判断、影响有多大或哪个更紧急，有时还需要进一步追问。"
        },
        {
          "id": "low",
          "title": "漏掉重要风险，或作出无依据的重要判断",
          "description": "对本专业负责、且当时信息已足够判断的事项，多次漏掉应当发现的重要风险，或缺少依据，却作出影响项目决策的重要判断。"
        }
      ]
    },
    {
      "id": "guidance",
      "title": "技术建议与方案指导",
      "prompt": "回顾本考核周期，遇到需要他提供专业建议的问题时，该评审人能否提出具体、可行的做法，让团队知道下一步怎么做？",
      "boundary": "只评价需要他提供专业建议的事项。看建议是否合理、能否实施，并且被采纳为标准，但不要求他替研发团队完成全部方案。",
      "options": [
        {
          "id": "high",
          "title": "建议具体，能指导下一步行动",
          "description": "大多数时候，能提出具体做法，说明什么条件下适用，并考虑项目的时间、成本或技术限制，让团队知道下一步怎么改、怎么验证。"
        },
        {
          "id": "medium",
          "title": "方向合理，具体做法还需补充",
          "description": "通常能指出合理的改进方向，但具体怎么做、什么条件下能用，有留白，需要团队进一步明确。"
        },
        {
          "id": "low",
          "title": "建议空泛，或明显行不通",
          "description": "对确实需要其专业建议的问题，多次只说“要优化”“再完善”，没有具体指导；或忽略已知限制，提出明显无法执行的建议。"
        }
      ]
    },
    {
      "id": "verification",
      "title": "验证证据与评审把关",
      "prompt": "回顾本考核周期，在需要他检查验证结果、确认问题是否解决时，该评审人能否核对证据，判断是否可以通过？",
      "boundary": "只评价他负责检查或确认的事项。项目团队没有按时解决问题，不直接算作他把关不到位；本期没有承担这类任务，也不按表现不足处理。",
      "options": [
        {
          "id": "high",
          "title": "能明确通过要求，并核对证据",
          "description": "大多数时候，能根据当前评审阶段，说清要验证什么、达到什么要求才算通过；会核对证据是否支持结论，不足时要求补充。"
        },
        {
          "id": "medium",
          "title": "能检查主要结果，发现明显不足",
          "description": "通常会检查主要验证结果，对明显不符合要求或材料缺失的情况，能提出补充要求。"
        },
        {
          "id": "low",
          "title": "证据没核清就通过，或随意改要求",
          "description": "对自己负责确认的事项，多次未核实关键证据就同意通过；或没有新的事实依据，却随意更改通过要求。"
        }
      ]
    },
    {
      "id": "collaboration",
      "title": "专业表达与评审担当",
      "prompt": "回顾本考核周期，该评审人能否对自己负责的问题给出明确判断，并在意见不一致时，围绕事实把问题讨论清楚？",
      "boundary": "不以是否好相处、是否赞同项目团队来判断。意见严格、坚持不同意见或最终没有达成一致，不直接算协作差。",
      "options": [
        {
          "id": "high",
          "title": "能说明理由，也能处理分歧",
          "description": "通常能说清理由，在分歧中把事实和问题讲清楚，推动形成明确的评审结论。有依据时坚持意见，出现新证据时也愿意调整判断。"
        },
        {
          "id": "medium",
          "title": "能表达意见，完成自己的专业判断",
          "description": "通常能说清自己的意见、配合讨论，并对自己负责的问题作出明确判断；遇到复杂分歧，还需要他人帮助协调。"
        },
        {
          "id": "low",
          "title": "回避应作出的判断，或妨碍讨论",
          "description": "对需要自己作出判断的问题，多次回避或不表态；或用没有依据的说法阻碍讨论，影响形成明确结论。"
        }
      ]
    },
    {
      "id": "contribution",
      "title": "可核实的突出技术贡献",
      "prompt": "本考核周期内，该评审人是否在你的项目中，作出过明显超出日常评审要求的贡献，而且有具体事例和证据可以说明？",
      "boundary": "普通建议被采纳，不直接算突出贡献；没有突出贡献，也不代表日常评审做得不好。一件符合条件的贡献即可，不要求多次发生。预计能带来的好处，要与已经实现的结果分开说明。",
      "options": [
        {
          "id": "high",
          "title": "有突出贡献，能提供依据",
          "description": "能说清他具体做了什么，因此避免了什么关键问题或带来了什么明显改善，并提供证据。例如，推动重大技术风险得到有效处理、解决关键技术难题，或使技术方案明显改善。"
        },
        {
          "id": "low",
          "title": "未发现符合条件的突出贡献",
          "description": "在你了解的项目中，未发现达到上述标准、且有证据支持的贡献。这个选项不代表他的日常评审表现不合格。"
        }
      ]
    }
  ],
  "scores": {
    "preparation": {
      "high": 10,
      "medium": 7,
      "low": 2
    },
    "judgment": {
      "high": 15,
      "medium": 10,
      "low": 0
    },
    "guidance": {
      "high": 15,
      "medium": 10,
      "low": 0
    },
    "verification": {
      "high": 10,
      "medium": 7,
      "low": 0
    },
    "collaboration": {
      "high": 10,
      "medium": 7,
      "low": 0
    },
    "contribution": {
      "high": 10,
      "low": 0
    }
  }
}
</script>
<script>
const config=JSON.parse(document.getElementById('questionnaire-data').textContent), key='tdt-questionnaire-cards-draft-v1';
const people=['甲','乙','丙','丁','戊','己','庚','辛'].map(s=>'虚拟评审人'+s);
let variant='a',active=null,loggedIn=true,guideSeen=false,answers={};
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
try{answers=JSON.parse(localStorage.getItem(key)||'null')||{}}catch(e){}
if(!Object.keys(answers).length){people.forEach((_,i)=>{answers[i]={};config.dimensions.slice(0,[6,3,0,6,1,0,4,0][i]).forEach((d,j)=>answers[i][d.id]={option:j===5?'low':'medium',reason:'',note:''})})}
function required(d,o){return d.id==='contribution'?o==='high':d.id!=='preparation'&&o==='low'}
function summary(i){const rows=answers[i]||{};let count=0,missing=false;config.dimensions.forEach(d=>{const r=rows[d.id];if(!r)return;count++;if(r.option==='unable'?!r.reason?.trim():required(d,r.option)&&!r.note?.trim())missing=true});return{count,done:count===6&&!missing,missing}}
function status(i){const s=summary(i);return s.done?'✓ 已完成':s.missing?'待补依据':s.count?'填写中':'未开始'}
function store(){try{localStorage.setItem(key,JSON.stringify(answers));return true}catch(e){return false}}
function card(i){const s=summary(i);return `<button class="card ${s.done?'done':''}" data-person="${i}" aria-label="${people[i]}，${status(i)}，${s.count}／6题"><span class="card-top"><span class="person-name">${people[i]}</span><span class="badge">${status(i)}</span></span><span class="card-bottom"><span><span class="count">${s.count}<small> ／ 6 题</small></span><span class="save-label">${s.count?'已保存':'尚未填写'}</span></span><span class="arrow" aria-hidden="true">→</span></span><span class="segments" aria-hidden="true">${Array.from({length:6},(_,n)=>`<i class="${n<s.count?'filled':''}"></i>`).join('')}</span></button>`}
function home(){
 active=null;
 const done=people.filter((_,i)=>summary(i).done).length;
 const heading=`<div class="heading"><div><h2>我的问卷<small>共 ${people.length} 个评审人</small></h2><p class="cycle">2026年度评审人考核</p></div><div class="overall"><strong>${done}</strong> ／ ${people.length} 已完成<progress max="${people.length}" value="${done}"></progress></div></div>`;
 const cards=variant==='c'?[false,true].map(complete=>{
  const ids=people.map((_,i)=>i).filter(i=>summary(i).done===complete);
  return `<h3 class="group-title">${complete?'已完成':'待完成'}<span>${ids.length} 份</span></h3><div class="grid group-grid">${ids.map(card).join('')||'<p>本组暂无问卷。</p>'}</div>`;
 }).join(''):`<div class="grid ${variant==='b'?'compact':''}">${people.map((_,i)=>card(i)).join('')}</div>`;
 document.getElementById('app').innerHTML=heading+cards;
 document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>openPerson(Number(b.dataset.person)));
}
function modal(title,html){document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-content').innerHTML=html;document.getElementById('dialog').showModal()}
function openPerson(i){active=i;renderQuestions();window.scrollTo(0,0);if(!guideSeen){guideSeen=true;modal('主观评价填写须知',`<p>${esc(config.instructions)}</p>`)}}
function renderQuestions(){const i=active;document.getElementById('app').innerHTML=`<section class="question-page" id="subjective-panel"><div class="subjective-heading"><h3>${people[i]}</h3><button type="button" class="info-tip" title="虚拟低功耗项目（P001）&#10;虚拟通信项目（P002）" aria-label="查看共同项目"><span class="info-tip-icon">!</span></button><button class="secondary-button" id="facts">查看评审过程详情</button><span class="saved" id="saved-state"></span></div><div class="subjective-fields">${config.dimensions.map((d,j)=>{const r=answers[i][d.id];const opts=j===5?d.options:[...d.options,{id:'unable',...config.unable}];return `<fieldset class="subjective-dimension"><legend>${j+1}．${esc(d.title)}</legend><p class="subjective-question">${esc(d.prompt)}</p><p class="subjective-boundary">职责边界：${esc(d.boundary)}</p><div class="subjective-options">${opts.map(o=>`<div class="subjective-option"><label><input type="radio" name="${d.id}" value="${o.id}" ${r?.option===o.id?'checked':''}><span><strong>${esc(o.title)}</strong><span class="subjective-description">${esc(o.description)}</span></span></label></div>`).join('')}</div>${r?.option==='unable'?`<label class="field"><span>原因（必填）</span><textarea data-reason="${d.id}" maxlength="500">${esc(r.reason)}</textarea></label>`:r&&required(d,r.option)?`<label class="field"><span>事实依据（必填）· 虚拟共同项目 P001</span><textarea data-note="${d.id}" maxlength="100">${esc(r.note)}</textarea></label>`:''}</fieldset>`}).join('')}</div><div class="assessment-pager"><button class="primary-button" id="return">← 返回我的问卷</button></div></section>`;
document.querySelectorAll('input[type=radio]').forEach(r=>r.onclick=e=>{e.preventDefault();const old=answers[i][r.name];if(old?.option===r.value)delete answers[i][r.name];else answers[i][r.name]={option:r.value,reason:'',note:''};store();setTimeout(renderQuestions,0)});
document.querySelectorAll('textarea').forEach(t=>t.oninput=()=>{const id=t.dataset.reason||t.dataset.note;answers[i][id][t.dataset.reason?'reason':'note']=t.value;const ok=store();savedState(ok)});
document.getElementById('return').onclick=()=>{home();window.scrollTo(0,0)};document.getElementById('facts').onclick=()=>modal('评审过程详情',`<p>${people[i]}</p><table><tr><th>项目</th><th>阶段</th><th>演示记录</th></tr><tr><td>虚拟低功耗项目</td><td>TDR1</td><td>已参与评审，提出意见并完成会签</td></tr></table>`);savedState(true)}
function savedState(ok){const s=summary(active);document.getElementById('saved-state').textContent=ok?`已保存 · ${s.count}／6题${s.done?' · 已完成':s.missing?' · 待补依据':''}`:'浏览器保存失败，请勿关闭页面'}
document.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>{variant=b.dataset.variant;document.querySelectorAll('[data-variant]').forEach(x=>x.setAttribute('aria-pressed',x===b));document.getElementById('design-note').textContent={a:'三列卡片，适合日常查看；整张卡片均可点击。此页仅保存虚拟演示数据。',b:'四列短卡片，适合评审人较多时集中浏览；小屏自动减少列数。',c:'待完成与已完成分区，适合优先处理遗漏问卷；完成后卡片移入已完成区。'}[variant];if(loggedIn)home()});
document.getElementById('home').onclick=()=>{if(loggedIn)home()};document.getElementById('close-dialog').onclick=()=>document.getElementById('dialog').close();
document.getElementById('logout').onclick=()=>{loggedIn=false;active=null;document.getElementById('app').innerHTML='<section class="logged-out"><h2>已退出登录</h2><p>演示问卷已保留在当前浏览器。</p><button class="primary-button" id="login">登录系统</button></section>';document.getElementById('login').onclick=()=>{loggedIn=true;guideSeen=false;home()}};
home();
</script></body></html>
