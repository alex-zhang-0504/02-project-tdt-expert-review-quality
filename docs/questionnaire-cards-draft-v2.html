<script>
const config=JSON.parse(document.getElementById('questionnaire-data').textContent), key='tdt-questionnaire-cards-draft-v2';
const people=['甲','乙','丙','丁','戊','己','庚','辛'].map(s=>'虚拟评审人'+s);
let variant='a',active=null,loggedIn=true,guideSeen=false,answers={};
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
try{answers=JSON.parse(localStorage.getItem(key)||'null')||{}}catch(e){}
if(!Object.keys(answers).length){people.forEach((_,i)=>{answers[i]={};config.dimensions.slice(0,[6,3,0,6,1,0,4,0][i]).forEach((d,j)=>answers[i][d.id]={option:j===5?'low':'medium',reason:'',note:''})})}
function required(d,o){return d.id==='contribution'?o==='high':d.id!=='preparation'&&o==='low'}
function summary(i){const rows=answers[i]||{};let count=0,missing=false;config.dimensions.forEach(d=>{const r=rows[d.id];if(!r)return;count++;if(r.option==='unable'?!r.reason?.trim():required(d,r.option)&&!r.note?.trim())missing=true});return{count,done:count===6&&!missing,missing}}
function status(i){const s=summary(i);return s.done?'✓ 已完成':s.missing?'待补依据':s.count?'填写中':'未开始'}
function store(){try{localStorage.setItem(key,JSON.stringify(answers));return true}catch(e){return false}}
function card(i){const s=summary(i);return `<button class="card ${s.done?'done':''}" data-person="${i}" aria-label="${people[i]}，${status(i)}，${s.count}／6题"><span class="card-top"><span class="person-name">${people[i]}</span><span class="badge">${status(i)}</span></span><span class="card-bottom"><span><span class="count">${s.count}<small> ／ 6 题</small></span><span class="save-label">${s.count?'已保存':'尚未填写'}</span></span><span class="arrow" aria-hidden="true">→</span></span><span class="segments" aria-hidden="true">${Array.from({length:6},(_,n)=>`<i class="${n<s.count?'filled':''}"></i>`).join('')}</span></button>`}
function managerHome(){
 active=null;
 const done=people.filter((_,i)=>summary(i).done).length;
 const heading=`<div class="heading"><div><h2>我的问卷<small>共 ${people.length} 个评审人</small></h2><p class="cycle">2026年度评审人考核</p></div><div class="overall"><strong>${done}</strong> ／ ${people.length} 已完成<progress max="${people.length}" value="${done}"></progress></div></div>`;
 const cards=variant==='c'?[false,true].map(complete=>{
  const ids=people.map((_,i)=>i).filter(i=>summary(i).done===complete);
  return `<h3 class="group-title">${complete?'已完成':'待完成'}<span>${ids.length} 份</span></h3><div class="grid group-grid">${ids.map(card).join('')||'<p>本组暂无问卷。</p>'}</div>`;
 }).join(''):`<div class="grid ${variant==='b'?'compact':''}">${people.map((_,i)=>card(i)).join('')}</div>`;
 document.getElementById('app').innerHTML=heading+cards;
 document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>openPerson(Number(b.dataset.person)));
}
function modal(title,html){document.getElementById('delete-actions')?.remove();document.getElementById('close-dialog').textContent='已知';document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-content').innerHTML=html;document.getElementById('dialog').showModal()}
function openPerson(i){active=i;renderQuestions();window.scrollTo(0,0);if(!guideSeen){guideSeen=true;modal('主观评价填写须知',`<p>${esc(config.instructions)}</p>`)}}
function renderQuestions(){const i=active;document.getElementById('app').innerHTML=`<section class="question-page" id="subjective-panel"><div class="subjective-heading"><h3>${people[i]}</h3><button type="button" class="info-tip" title="虚拟低功耗项目（P001）&#10;虚拟通信项目（P002）" aria-label="查看共同项目"><span class="info-tip-icon">!</span></button><button class="secondary-button" id="facts">查看评审过程详情</button><span class="saved" id="saved-state"></span></div><div class="subjective-fields">${config.dimensions.map((d,j)=>{const r=answers[i][d.id];const opts=j===5?d.options:[...d.options,{id:'unable',...config.unable}];return `<fieldset class="subjective-dimension"><legend>${j+1}．${esc(d.title)}</legend><p class="subjective-question">${esc(d.prompt)}</p><p class="subjective-boundary">职责边界：${esc(d.boundary)}</p><div class="subjective-options">${opts.map(o=>`<div class="subjective-option"><label><input type="radio" name="${d.id}" value="${o.id}" ${r?.option===o.id?'checked':''}><span><strong>${esc(o.title)}</strong><span class="subjective-description">${esc(o.description)}</span></span></label></div>`).join('')}</div>${r?.option==='unable'?`<label class="field"><span>原因（必填）</span><textarea data-reason="${d.id}" maxlength="500">${esc(r.reason)}</textarea></label>`:r&&required(d,r.option)?`<label class="field"><span>事实依据（必填）· 虚拟共同项目 P001</span><textarea data-note="${d.id}" maxlength="100">${esc(r.note)}</textarea></label>`:''}</fieldset>`}).join('')}</div><div class="assessment-pager"><button class="primary-button" id="return">← 返回我的问卷</button></div></section>`;
document.querySelectorAll('input[type=radio]').forEach(r=>r.onclick=e=>{e.preventDefault();const old=answers[i][r.name];if(old?.option===r.value)delete answers[i][r.name];else answers[i][r.name]={option:r.value,reason:'',note:''};store();setTimeout(renderQuestions,0)});
document.querySelectorAll('textarea').forEach(t=>t.oninput=()=>{const id=t.dataset.reason||t.dataset.note;answers[i][id][t.dataset.reason?'reason':'note']=t.value;const ok=store();savedState(ok)});
document.getElementById('return').onclick=()=>{home();window.scrollTo(0,0)};document.getElementById('facts').onclick=()=>modal('评审过程详情',`<p>${people[i]}</p><table><tr><th>项目</th><th>阶段</th><th>演示记录</th></tr><tr><td>虚拟低功耗项目</td><td>TDR1</td><td>已参与评审，提出意见并完成会签</td></tr></table>`);savedState(true)}
function savedState(ok){const s=summary(active);document.getElementById('saved-state').textContent=ok?`已保存 · ${s.count}／6题${s.done?' · 已完成':s.missing?' · 待补依据':''}`:'浏览器保存失败，请勿关闭页面'}
document.getElementById('home').onclick=()=>{if(loggedIn)home()};document.getElementById('close-dialog').onclick=()=>document.getElementById('dialog').close();
document.getElementById('logout').onclick=()=>{loggedIn=false;active=null;document.getElementById('app').innerHTML='<section class="logged-out"><h2>已退出登录</h2><p>演示问卷已保留在当前浏览器。</p><button class="primary-button" id="login">登录系统</button></section>';document.getElementById('login').onclick=()=>{loggedIn=true;guideSeen=false;home()}};

let view='manager',taskSequence=20;
const taskStorage='tdt-card-draft-v2-tasks';
function seedTasks(){return Array.from({length:10},(_,i)=>({id:'task-'+i,name:(2026-Math.floor(i/2))+(i%2?'上半年':'年度')+'评审人考核',completed:i>1,reportCount:21-i,expertCount:14-i,objective:i?60:100,started:i?2:3,managers:6,done:i?8:3,total:28}))}
let demoTasks;try{demoTasks=JSON.parse(localStorage.getItem(taskStorage)||'null')}catch(e){}if(!Array.isArray(demoTasks))demoTasks=seedTasks();
function persistTasks(){try{localStorage.setItem(taskStorage,JSON.stringify(demoTasks))}catch(e){}}
function home(){if(view==='admin')adminHome();else managerHome()}
function setView(next){view=next;loggedIn=true;active=null;document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view));document.getElementById('demo-identity').textContent=view==='admin'?'虚拟管理员 · 0001 · 管理员':'虚拟项目经理 · 1001 · 项目经理';document.querySelectorAll('.module-tab').forEach((b,i)=>{b.disabled=view==='manager'&&i!==2;b.classList.toggle('is-active',view==='manager'?i===2:i===0);const lock=b.querySelector('.lock');if(lock)lock.hidden=view==='admin';if(view==='admin')b.onclick=()=>i===0?adminHome():modal(b.textContent.trim(),'<p>此处仅演示任务卡片。正式模块继续沿用现有设计。</p>');else b.onclick=()=>{if(i===2)home()}});home();window.scrollTo({top:0,behavior:'instant'})}
function taskCard(t){return `<article class="admin-task" data-task="${t.id}"><button class="task-open" data-open="${t.id}"><span class="admin-title"><strong>${esc(t.name)}</strong><span class="admin-status">${t.completed?'✓ 已完成':'进行中'}</span></span><span class="admin-meta">${t.reportCount}份报告 · ${t.expertCount}位评审人</span>${t.completed?'<span>查看本期总分统计 →</span>':`<span class="admin-progress-label"><span>客观数据评价</span><span>${t.objective===100?'已完成':'识别与评分中'}</span></span><progress max="100" value="${t.objective}" aria-label="客观数据评价进度"></progress><span class="admin-progress-label"><span>主观评价 · 已开始${t.started}／${t.managers}人</span><span>${t.done}／${t.total}份问卷已完成</span></span><progress max="${t.total}" value="${t.done}" aria-label="主观评价进度"></progress>`}</button><div class="admin-controls">${t.completed?'':`<button class="white-action" data-policy="objective" data-id="${t.id}">客观评分参数</button><button class="white-action" data-policy="subjective" data-id="${t.id}">主观评分参数</button>`}<button class="white-action" data-delete="${t.id}">删除任务</button></div></article>`}
function adminHome(){active=null;document.getElementById('app').innerHTML='<div class="heading"><h2>考核任务信息</h2><p id="task-feedback" role="status"></p></div><div class="admin-list"><button class="new-blue-task" id="new-task">＋ 新建考评任务</button>'+demoTasks.map(taskCard).join('')+'</div>';wireTasks();}
function wireTasks(){document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>confirmDelete(b.dataset.delete));document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const t=demoTasks.find(t=>t.id===b.dataset.open);modal(t.name,t.completed?'<p>本期考评已完成 · 演示历史结果</p><div class="admin-history"><span>客观得分 <strong>26</strong></span><span>主观得分 <strong>62</strong></span><span>总分 <strong>88</strong></span></div>':'<p>进入读取评审报告与匹配名单。该模块沿用现有正式页面，本 Demo 仅演示卡片入口。</p>');document.getElementById('close-dialog').textContent='关闭'});document.querySelectorAll('[data-policy]').forEach(b=>b.onclick=()=>{modal(b.dataset.policy==='objective'?'客观评分参数':'主观评分参数','<p>保留独立入口，编辑方式沿用正式系统。本 Demo 不修改评分配置。</p>')});document.getElementById('new-task').onclick=()=>{modal('新建考评任务','<label class="demo-field">年份<select id="new-year">'+[2027,2026,2025].map(y=>`<option>${y}</option>`).join('')+'</select></label><label class="demo-field">考评周期<select id="new-period"><option>年度</option><option>上半年</option><option>下半年</option></select></label><button class="primary-button" id="create-demo">创建演示任务</button>');document.getElementById('create-demo').onclick=()=>{demoTasks.unshift({id:'new-'+Date.now()+'-'+taskSequence++,name:document.getElementById('new-year').value+document.getElementById('new-period').value+'评审人考核',completed:false,reportCount:0,expertCount:0,objective:0,started:0,managers:6,done:0,total:28});persistTasks();document.getElementById('dialog').close();adminHome()}}}
function confirmDelete(id){const t=demoTasks.find(t=>t.id===id);modal('删除任务',`<p>确认删除「${esc(t.name)}」？</p><p>仅删除本 Demo 的虚拟任务。</p>`);const actions=document.createElement('div');actions.id='delete-actions';actions.className='delete-dialog-actions';actions.innerHTML='<button class="secondary-button" id="cancel-delete">取消</button><button class="primary-button" id="confirm-delete">确认删除</button>';document.getElementById('dialog-content').append(actions);document.getElementById('close-dialog').hidden=true;document.getElementById('cancel-delete').onclick=()=>document.getElementById('dialog').close();document.getElementById('confirm-delete').onclick=()=>deleteTask(id);document.getElementById('cancel-delete').focus({preventScroll:true})}
function deleteTask(id){
 const element=document.querySelector(`[data-task="${id}"]`);if(!element)return;
 const y=window.scrollY;
 const positions=new Map([...document.querySelectorAll('[data-task]')].map(e=>[e,e.getBoundingClientRect().top]));
 const next=element.nextElementSibling||element.previousElementSibling;
 // Close while the original trigger still exists, then move focus without scrolling.
 document.getElementById('dialog').close();
 demoTasks=demoTasks.filter(t=>t.id!==id);persistTasks();element.remove();
 (next?.querySelector('[data-delete]')||document.getElementById('new-task')).focus({preventScroll:true});
 const maxY=Math.max(0,document.documentElement.scrollHeight-window.innerHeight);
 window.scrollTo({top:Math.min(y,maxY),behavior:'instant'});
 document.getElementById('task-feedback').textContent=`任务已删除，剩余 ${demoTasks.length} 项`;
 if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  positions.forEach((top,e)=>{if(!e.isConnected)return;const now=e.getBoundingClientRect().top,dy=top-now;if(dy&&now<window.innerHeight&&now+e.offsetHeight>0)e.animate([{transform:`translateY(${dy}px)`},{transform:'translateY(0)'}],{duration:180,easing:'ease'})});
 }
}
document.getElementById('dialog').addEventListener('close',()=>{document.getElementById('close-dialog').hidden=false;document.getElementById('delete-actions')?.remove()});
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
document.getElementById('reset-tasks').onclick=()=>{demoTasks=seedTasks();persistTasks();setView('admin')};

home();
</script></body></html>
