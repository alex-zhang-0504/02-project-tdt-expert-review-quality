;margin:0 auto;padding:28px 32px 36px}.draft-note{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:9px 32px;color:var(--muted);font-size:12px;background:var(--surface)}.draft-note strong{color:var(--ink);font-weight:500}.login{max-width:460px;margin:42px auto 60px;border:1px solid var(--line);padding:30px}.login form{display:grid;gap:20px;margin-top:24px}.login h2{font-size:25px}.login-error{min-height:24px}.list{margin-top:24px;display:grid;gap:14px}.assessment{border:1px solid var(--line);padding:22px 24px;border-radius:2px}.assessment p{margin-top:6px}.badge{font-size:13px;padding:3px 10px;background:var(--soft);white-space:nowrap}.list .details-row{display:flex;align-items:center;gap:18px;margin-top:16px}.progress{height:5px;background:var(--line);max-width:340px;flex:1}.progress>span{display:block;height:100%;background:var(--accent)}.pager{display:flex;justify-content:center;margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}.pager button{min-width:220px}.settings{border-top:1px solid var(--line);margin-top:26px;padding-top:18px}.settings summary{cursor:pointer}.settings-content{padding-top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.source{margin-top:22px;padding:22px;border:1px solid var(--line)}.source-tools{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;margin-top:14px}.scenarios{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:18px;font-size:13px}.scenarios input{width:auto;accent-color:var(--accent)}.scan{margin-top:22px}.scan-row{border-bottom:1px solid var(--line);padding:14px 0;display:flex;justify-content:space-between;gap:16px}.scan-row span:last-child{white-space:nowrap}.scanbar{height:4px;background:var(--line);margin-top:12px}.scanbar>span{height:100%;display:block;background:var(--accent);transition:width .3s}.exception{border:1px solid var(--line);padding:18px;margin-top:20px;color:var(--ink)}.error-label{color:var(--danger);font-weight:600}.exception .row{margin-top:12px}.exception select{max-width:360px}.roster{margin-top:24px;border-top:1px solid var(--line);padding-top:22px}.roster-upload{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin:18px 0}.roster-upload .file-name{text-align:left;font-weight:500}.roster-results{margin-top:14px;border-top:1px solid var(--line)}.roster-result{display:grid;grid-template-columns:80px 60px 1fr;gap:12px;border-bottom:1px solid var(--line);padding:10px 12px}.roster-result:first-child{background:var(--soft)}.roster-actions{display:flex;justify-content:flex-end;align-items:center;gap:16px;margin-top:20px;flex-wrap:wrap}.receipt{margin-top:16px;padding:14px 18px;background:var(--surface)}.receipt summary{cursor:pointer}.receipt code{font-size:12px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0}.metric{border:1px solid var(--line);padding:20px}.metric strong{font-size:28px;display:block}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;margin-top:22px;white-space:nowrap}th,td{padding:13px 16px;border:1px solid var(--line);text-align:left}th{background:var(--accent);color:white;font-weight:500}tbody tr:nth-child(even){background:var(--surface)}.questions{display:grid;gap:20px;margin-top:24px}.question{border:1px solid var(--line);padding:20px}.question h3{font-size:16px}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.option{border:1px solid var(--line);padding:13px;cursor:pointer;display:flex;align-items:center;gap:10px}.option:has(input:checked){border-color:var(--accent);background:var(--soft)}.option input{width:auto;accent-color:var(--accent)}.status{font-size:13px;color:var(--muted)}.review-top{display:flex;align-items:center;gap:12px;margin-top:16px}.review-top select{width:auto}.person{color:var(--ink)!important}.mini-note{font-size:13px;color:var(--muted);margin-top:12px}dialog{border:1px solid var(--line);border-radius:2px;padding:26px;max-width:760px;width:calc(100% - 48px);color:var(--ink)}dialog::backdrop{background:rgba(54,54,54,.22)}dialog textarea{min-height:320px;font:13px/1.6 Consolas,monospace;margin-top:16px}dialog .actions{display:flex;justify-content:flex-end;gap:12px;margin-top:16px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);max-width:90%;padding:12px 20px;background:var(--ink);color:#fff;z-index:10}.toast[hidden]{display:none}button.small{padding:6px 12px;font-size:13px}.info{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--ink);border-radius:50%;width:16px;height:16px;font-size:11px;margin-left:8px;cursor:help;vertical-align:middle}

<style>
:root{--surface-soft:#f6f6f6;--accent-soft:#e6f4fe;--line-strong:#b8b8b8;--font-weight-control:600;--font-size-content:16px;--font-size-supporting:14px}
[hidden]{display:none!important}.password-wrap{position:relative}.password-wrap input{padding-right:52px}.password-eye{position:absolute;right:4px;top:4px;bottom:4px;width:42px;padding:8px;display:grid;place-items:center;border:0;background:transparent}.password-eye svg{width:22px;height:22px}.login-error:empty{display:none}.inline-title{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.count-note{font-size:14px;font-weight:400;color:var(--muted)}
.project-info{position:relative;display:inline-flex;align-items:center}.project-info>button{padding:0;margin:0;width:20px;height:20px;background:white;border-radius:50%;border-color:var(--ink);font-size:13px;font-weight:400;line-height:1}.project-popover{display:none;position:absolute;z-index:5;top:100%;left:0;width:min(430px,calc(100vw - 64px));padding:16px;background:white;border:1px solid var(--line-strong);box-shadow:0 2px 8px #0000000a;font-size:14px;font-weight:400;color:var(--ink)}.project-popover ul{margin:10px 0 0;padding-left:20px;max-height:240px;overflow:auto}.project-popover li{padding:5px 0;overflow-wrap:anywhere}.project-info:hover .project-popover,.project-info:focus-within .project-popover,.project-info.pinned .project-popover{display:block}

.subjective-options{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.subjective-options:has(>.subjective-option:nth-child(2):last-child){grid-template-columns:repeat(2,minmax(0,1fr))}.subjective-option{position:relative;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface-soft);transition:transform .18s ease,background-color .18s ease,border-color .18s ease,filter .18s ease}.subjective-option:hover{transform:translateY(-3px);filter:brightness(.94);border-color:var(--accent)}.subjective-option:active{transform:translateY(0) scale(.98);filter:brightness(.88)}.subjective-option:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}.subjective-option:focus-within{outline:2px solid var(--accent);outline-offset:2px}.subjective-option label{display:flex;align-items:flex-start;gap:10px;padding:14px;cursor:pointer;min-height:106px;height:100%}.subjective-option input{width:16px;height:16px;margin:4px 0 0;accent-color:var(--accent);flex-shrink:0}.subjective-option strong{display:block;font-size:16px;font-weight:600}.subjective-description{display:block;margin-top:8px;font-size:14px;line-height:1.5;color:var(--muted)}
.subjective-rating-tools{margin-top:8px}.subjective-evidence{font-size:14px;padding:10px 12px;border-left:2px solid var(--line-strong);background:var(--surface-soft)}.subjective-evidence summary{cursor:pointer;color:var(--muted)}.subjective-evidence-fields{display:grid;grid-template-columns:minmax(150px,1fr) 2fr auto;gap:12px;align-items:end;margin:10px 0}.subjective-evidence-fields input,.subjective-evidence-fields select{width:100%;min-width:0}.subjective-footer{display:flex;gap:18px;align-items:center;padding:8px 0;font-size:14px}.subjective-footer progress{width:130px;height:4px;accent-color:var(--accent)}
@media(max-width:760px){.subjective-options,.subjective-options:has(>.subjective-option:nth-child(2):last-child),.subjective-evidence-fields{grid-template-columns:1fr}.subjective-options{gap:8px}.subjective-option label{min-height:0;gap:6px}.count-note{font-size:13px}}
@media(prefers-reduced-motion:reduce){.subjective-option{transition:none}.subjective-option:hover,.subjective-option:active{transform:none}}
.inline-title{position:relative}.project-info{position:static}.project-popover{left:0;right:auto}#subjective-panel{font-family:"Aptos","Segoe UI",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","微软雅黑","Hiragino Sans GB",sans-serif;line-height:1.55}

<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lock='<svg class="lock" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="4" y="9" width="12" height="9" rx="1"/><path d="M6 9V6a4 4 0 018 0v3"/><path d="M10 12v3"/></svg>';
let accounts=[{employee_id:'0001',name:'虚拟管理员',role:'admin',enabled:true,owner_ids:['ou_demo_admin']},{employee_id:'1001',name:'虚拟项目经理甲',role:'project_manager',enabled:true,owner_ids:['ou_demo_a']},{employee_id:'1002',name:'虚拟项目经理乙',role:'project_manager',enabled:true,owner_ids:['ou_demo_b']}];
const state={user:null,page:'login',scenario:'normal',scanned:false,scanning:false,percent:0,bound:false,confirmed:false,policy:false,names:'虚拟评审人甲\n虚拟评审人乙',roster:null,expert:'虚拟评审人甲',manager:'1001',answers:{},objective:false,created:false};
const questionnairePolicy={"version":"4","instructions":"请回顾本考核周期内，你与该评审人共同参与的项目评审。前五题看他平时的表现，不只看最近一次或印象最深的一次；第六题看有没有具体的突出贡献。不了解或没有足够依据时，选择暂无法判断，不要把不了解当作表现不好。","unable":{"title":"暂无法判断","description":"我对他这方面的表现了解不够，或现有记录不足，无法作出判断。","reason_prompt":"请说明原因，不作为低档评价。"},"contribution_prompt":"哪个项目？他具体做了什么？带来了什么重要变化？有什么记录可以证明？","dimensions":[{"id":"preparation","title":"评审准备与重点把握","prompt":"回顾本考核周期，在你参加的项目评审中，该评审人能否抓住本专业需要重点讨论的问题？","boundary":"看讨论中能否抓住重点，并充分讨论。不以发言快慢或多少来判断；材料未提供等外部原因，不直接归责于评审人。","options":[{"id":"high","title":"能抓住重点","description":"大多数时候，了解项目目标、技术方案和主要限制，能抓住本专业最需要关注的问题，让讨论围绕重点展开。"},{"id":"medium","title":"能完成基本评审","description":"通常了解项目背景和资料，能完成本专业的基本评审；但哪些问题最关键、应该先讨论什么，有时需要别人提醒。"},{"id":"low","title":"准备或理解不足","description":"在已收到必要资料的情况下，多次因不了解项目或理解错误，抓不住重点、明显偏离议题，影响评审。"}]},{"id":"judgment","title":"风险辨识与专业判断","prompt":"回顾本考核周期，该评审人能否发现评审技术中的重要风险，并说清楚为什么这样判断、可能造成什么影响？","boundary":"看判断是否有依据，不只看提出了多少条意见，并要结合看在项目结束、落地产品、或截止目前是否获得了相关实践。","options":[{"id":"high","title":"能发现重要风险，并说明依据","description":"大多数时候，能发现重要风险，说清判断依据、可能影响和哪些需要优先处理；拿不准的地方也会明确说明，帮助团队作出决定。"},{"id":"medium","title":"能发现常见问题，判断基本合理","description":"通常能发现常见问题，判断基本合理；但为什么这样判断、影响有多大或哪个更紧急，有时还需要进一步追问。"},{"id":"low","title":"漏掉重要风险，或作出无依据的重要判断","description":"对本专业负责、且当时信息已足够判断的事项，多次漏掉应当发现的重要风险，或缺少依据，却作出影响项目决策的重要判断。"}]},{"id":"guidance","title":"技术建议与方案指导","prompt":"回顾本考核周期，遇到需要他提供专业建议的问题时，该评审人能否提出具体、可行的做法，让团队知道下一步怎么做？","boundary":"只评价需要他提供专业建议的事项。看建议是否合理、能否实施，并且被采纳为标准，但不要求他替研发团队完成全部方案。","options":[{"id":"high","title":"建议具体，能指导下一步行动","description":"大多数时候，能提出具体做法，说明什么条件下适用，并考虑项目的时间、成本或技术限制，让团队知道下一步怎么改、怎么验证。"},{"id":"medium","title":"方向合理，具体做法还需补充","description":"通常能指出合理的改进方向，但具体怎么做、什么条件下能用，有留白，需要团队进一步明确。"},{"id":"low","title":"建议空泛，或明显行不通","description":"对确实需要其专业建议的问题，多次只说“要优化”“再完善”，没有具体指导；或忽略已知限制，提出明显无法执行的建议。"}]},{"id":"verification","title":"验证证据与评审把关","prompt":"回顾本考核周期，在需要他检查验证结果、确认问题是否解决时，该评审人能否核对证据，判断是否可以通过？","boundary":"只评价他负责检查或确认的事项。项目团队没有按时解决问题，不直接算作他把关不到位；本期没有承担这类任务，也不按表现不足处理。","options":[{"id":"high","title":"能明确通过要求，并核对证据","description":"大多数时候，能根据当前评审阶段，说清要验证什么、达到什么要求才算通过；会核对证据是否支持结论，不足时要求补充。"},{"id":"medium","title":"能检查主要结果，发现明显不足","description":"通常会检查主要验证结果，对明显不符合要求或材料缺失的情况，能提出补充要求。"},{"id":"low","title":"证据没核清就通过，或随意改要求","description":"对自己负责确认的事项，多次未核实关键证据就同意通过；或没有新的事实依据，却随意更改通过要求。"}]},{"id":"collaboration","title":"专业表达与评审担当","prompt":"回顾本考核周期，该评审人能否对自己负责的问题给出明确判断，并在意见不一致时，围绕事实把问题讨论清楚？","boundary":"不以是否好相处、是否赞同项目团队来判断。意见严格、坚持不同意见或最终没有达成一致，不直接算协作差。","options":[{"id":"high","title":"能说明理由，也能处理分歧","description":"通常能说清理由，在分歧中把事实和问题讲清楚，推动形成明确的评审结论。有依据时坚持意见，出现新证据时也愿意调整判断。"},{"id":"medium","title":"能表达意见，完成自己的专业判断","description":"通常能说清自己的意见、配合讨论，并对自己负责的问题作出明确判断；遇到复杂分歧，还需要他人帮助协调。"},{"id":"low","title":"回避应作出的判断，或妨碍讨论","description":"对需要自己作出判断的问题，多次回避或不表态；或用没有依据的说法阻碍讨论，影响形成明确结论。"}]},{"id":"contribution","title":"可核实的突出技术贡献","prompt":"本考核周期内，该评审人是否在你的项目中，作出过明显超出日常评审要求的贡献，而且有具体事例和证据可以说明？","boundary":"普通建议被采纳，不直接算突出贡献；没有突出贡献，也不代表日常评审做得不好。一件符合条件的贡献即可，不要求多次发生。预计能带来的好处，要与已经实现的结果分开说明。","options":[{"id":"high","title":"有突出贡献，能提供依据","description":"能说清他具体做了什么，因此避免了什么关键问题或带来了什么明显改善，并提供证据。例如，推动重大技术风险得到有效处理、解决关键技术难题，或使技术方案明显改善。"},{"id":"low","title":"未发现符合条件的突出贡献","description":"在你了解的项目中，未发现达到上述标准、且有证据支持的贡献。这个选项不代表他的日常评审表现不合格。"}]}],"scores":{"preparation":{"high":10,"medium":7,"low":2},"judgment":{"high":15,"medium":10,"low":0},"guidance":{"high":15,"medium":10,"low":0},"verification":{"high":10,"medium":7,"low":0},"collaboration":{"high":10,"medium":7,"low":0},"contribution":{"high":10,"low":0}}};
const experts=['虚拟评审人甲','虚拟评审人乙'];
const modules=[['list','读取评审表'],['objective','客观数据评价'],['subjective','主观评价'],['total','总分统计']];
let timer,toastTimer;
function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,2600)}
function goto(page){state.page=page;render();window.scrollTo({top:0,behavior:'instant'})}
function requiresEvidence(id,option){return id==='contribution'?option==='high':id!=='preparation'&&option==='low'}
function answerProgress(e,mid=state.manager){const ratings=state.answers[mid+'|'+e]||{};let valid=0,selected=0;for(const d of questionnairePolicy.dimensions){const r=ratings[d.id];if(!r)continue;const allowed=d.options.some(o=>o.id===r.option)||(d.id!=='contribution'&&r.option==='unable');if(!allowed)continue;selected++;if(r.option==='unable'){if(r.reason?.trim())valid++}else if(requiresEvidence(d.id,r.option)){const rows=(r.evidence||[]).filter(x=>x.project_code||x.note?.trim());if(rows.length&&rows.every(x=>commonProjects(e,mid).some(p=>p.code===x.project_code)&&x.note?.trim()))valid++}else valid++}return {valid,selected}}
function completed(e,mid=state.manager){return answerProgress(e,mid).valid===6}
function commonProjects(e=state.expert,mid=state.manager){const names=mid==='1002'?(e===experts[0]?['虚拟散热优化项目','虚拟可靠性项目']:['虚拟通信项目','虚拟连接稳定性项目']):(e===experts[0]?['虚拟低功耗项目','虚拟通信项目','虚拟平台升级项目','虚拟续航优化项目','虚拟音频降噪项目','虚拟显示优化项目','虚拟结构验证项目','虚拟连接稳定性项目']:['虚拟通信项目','虚拟显示优化项目']);return names.map((name,i)=>({code:`DEMO-${mid}-${experts.indexOf(e)+1}-${i+1}`,name}))}
function currentRatings(){return state.answers[state.manager+'|'+state.expert]||={}}
function saveIndicator(){const p=answerProgress(state.expert);const label=`已保存 · ${p.valid}／6题${p.selected>p.valid?' · 待补依据或原因':''}`;$('#save-status').textContent=label;$('#subjective-completion').textContent=p.valid===6?'6／6题 · 已完成':`${p.valid}／6题 · 待完成`;$('#subjective-completion-bar').value=p.valid}
function eyeIcon(visible){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">${visible?'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>':'<path d="m3 3 18 18M9.5 5.4A12 12 0 0112 5c6.5 0 10 7 10 7a19 19 0 01-3.1 3.9M6.1 6.1A21 21 0 002 12s3.5 7 10 7a12 12 0 005.9-1.8M10 10a3 3 0 004 4"/>'}</svg>`}
function roleName(u){return u.role==='admin'?'管理员':'项目经理'}
function render(){
 const u=state.user,admin=u?.role==='admin',isList=['list','my-list'].includes(state.page),active=['read','list'].includes(state.page)?'list':state.page==='my-list'?'subjective':state.page;
 $('#header').innerHTML=`<div class="header-row"><div><p class="eyebrow">TDT REVIEW</p><h1>评审人考核系统</h1></div><div class="identity">${u?`<span class="person">${esc(u.name)} · ${esc(u.employee_id)} · ${roleName(u)}</span>`:''}<span class="version">试用版 v0.6 · 模拟</span>${u&&isList?'<button class="ghost small" data-action="switch">log out</button>':''}</div></div>${u?`<nav class="tabs" aria-label="考核模块">${modules.map(([id,label])=>`<button ${!admin&&id!=='subjective'?'disabled aria-label="'+label+'，已锁定" title="仅管理员可操作"':''} class="${active===id?'active':''}" data-nav="${id}" ${active===id?'aria-current="page"':''}>${!admin&&id!=='subjective'?lock:''}${label}</button>`).join('')}</nav>`:''}`;
 $('#main').innerHTML=state.page==='login'?login():state.page==='list'?list():state.page==='read'?read():state.page==='my-list'?myList():state.page==='subjective'?subjective():state.page==='objective'?objective():total();
 if(state.page==='login'){updateLogin();$('#login-account').onchange=updateLogin;$('#login-form').onsubmit=loginSubmit}
 if(state.page==='read'){$('#roster-names')?.addEventListener('input',e=>{state.names=e.target.value;state.roster=null});document.querySelectorAll('[name=scenario]').forEach(r=>r.onchange=()=>{state.scenario=r.value;state.scanned=false;state.bound=false;state.confirmed=false;state.policy=false;render()})}
 if(state.page==='subjective'){$('#review-manager')?.addEventListener('change',e=>{state.manager=e.target.value;render()});saveIndicator();bindQuestionnaire()}
}
function login(){return `<section class="login"><h2>选择账号登录</h2><form id="login-form"><label class="field">姓名与工号<select id="login-account">${accounts.filter(u=>u.enabled).map(u=>`<option value="${esc(u.employee_id)}">${esc(u.name)} · ${esc(u.employee_id)}</option>`).join('')}</select></label><div id="password-area"><label class="field" for="login-password">管理员密码</label><div class="password-wrap"><input type="password" id="login-password" autocomplete="off" placeholder="请输入密码" /><button type="button" class="password-eye" data-action="password-eye" aria-label="显示密码" aria-pressed="false">${eyeIcon(false)}</button></div></div><button class="primary" type="submit">登录系统</button><p id="login-error" class="login-error" role="status"></p></form></section>`}
function updateLogin(){const u=accounts.find(u=>u.employee_id===$('#login-account').value);$('#password-area').hidden=u?.role!=='admin';$('#login-password').required=u?.role==='admin';$('#login-password').type='password';$('#login-password').value='';const eye=$('.password-eye');eye.innerHTML=eyeIcon(false);eye.setAttribute('aria-label','显示密码');eye.setAttribute('aria-pressed','false');$('#login-error').textContent=''}
function loginSubmit(e){e.preventDefault();const u=accounts.find(u=>u.employee_id===$('#login-account').value);if(!u)return;if(u.role==='admin'&&$('#login-password').value!=='demo123'){$('#login-error').textContent='演示密码不正确，请输入 demo123。';return}state.user=u;state.manager=u.role==='admin'?'1001':u.employee_id;goto(u.role==='admin'?'list':'my-list')}
function pager(action,label){return `<div class="pager"><button class="primary" data-action="${action}">${label}</button></div>`}
function list(){return `<div class="heading"><div><p class="eyebrow">读取评审表 · 第1页</p><h2>考核任务信息</h2></div><span class="status">数据自动保存在本机（演示）</span></div><div class="list"><article class="assessment"><div class="row"><div><h3>2026年度评审人考核${state.created?' · 新建演示':''}</h3><p class="muted">${state.confirmed?'2份报告 · 2位评审人 · 参数已固定':'2份报告 · 2位评审人 · 问卷填写中'}</p></div><button data-action="open-assessment">打开考核</button></div><div class="details-row"><span class="badge">进行中</span><span>项目经理已完成 ${experts.filter(e=>completed(e,'1001')).length}／2 份问卷</span><div class="progress"><span style="width:${experts.filter(e=>completed(e,'1001')).length*50}%"></span></div></div></article><article class="assessment"><div class="row"><div><h3>2026上半年评审人考核</h3><p class="muted">8份报告 · 6位评审人 · 已确认结果</p></div><button data-action="history">查看结果</button></div></article></div><details class="settings"><summary>管理设置</summary><div class="settings-content"><button data-action="config">账号配置</button><button data-action="backup">备份全部数据</button><span class="muted">日常填写无需手动保存数据库。</span></div></details>${pager('new','新建考评任务 →')}`}
function read(){let bad=state.scanned&&state.scenario==='exception'&&!state.bound;return `<div class="heading"><div><p class="eyebrow">读取评审表 · 第2页</p><h2>读取与匹配</h2></div><span class="badge">${state.confirmed?'名单与参数已固定':'待确认'}</span></div><section class="source"><h3>飞书批量文件扫描</h3><div class="source-tools"><label class="field">飞书归档文件夹<input aria-label="飞书归档文件夹" value="https://example.feishu.cn/drive/folder/demo" /></label><button class="primary" data-action="scan" ${state.scanning||state.confirmed?'disabled':''}>${state.scanning?'正在扫描…':'模拟读取评审表'}</button></div><div class="scenarios"><span class="muted">试用场景</span><label><input type="radio" name="scenario" value="normal" ${state.scenario==='normal'?'checked':''} ${state.scanning?'disabled':''}/> 全部owner ID已配置</label><label><input type="radio" name="scenario" value="exception" ${state.scenario==='exception'?'checked':''} ${state.scanning?'disabled':''}/> 有一个owner ID未配置</label></div>${state.scanning?`<div class="scanbar"><span style="width:${state.percent}%"></span></div><p class="mini-note" id="scan-progress">正在读取 ${state.percent}%</p>`:''}${state.scanned?`<div class="scan"><div class="scan-row"><span>虚拟低功耗项目 · TDR1评审报告</span><span>检查通过</span></div><div class="scan-row"><span>虚拟通信项目 · TDR3评审报告</span><span>检查通过</span></div><p class="mini-note">已读取2份报告。${bad?'项目经理归属有1项待确认。':'项目经理已按owner ID自动匹配。'}</p></div>`:''}${bad?`<section class="exception"><span class="error-label">1项待确认</span><h3>项目经理匹配异常</h3><p class="person">虚拟项目经理乙 · ou_demo_new</p><p class="muted">该ID未登记，涉及2份报告。选择一次后建立固定关联。</p><div class="row"><select id="bind-account" aria-label="异常owner ID对应账号"><option value="">请选择对应账号</option>${accounts.filter(u=>u.enabled).map(u=>`<option value="${esc(u.employee_id)}">${esc(u.name)} · ${esc(u.employee_id)}</option>`).join('')}</select><button data-action="bind">确认归属</button></div></section>`:''}</section>${state.scanned?roster():''}${pager('back-list','← 返回考核任务信息')}`}
function roster(){return `<section class="roster"><h3>考核评审人名单<span class="info" tabindex="0" title="只考核名单与已读取报告的交集">!</span></h3><div class="roster-upload"><span>导入名单 Excel（含姓名列）</span><button class="file-name" data-action="sample-roster" ${state.confirmed?'disabled':''}>TDT技术项目评审人员名单.xlsx（示例）</button><button data-action="match" ${state.confirmed?'disabled':''}>手动匹配名单</button></div><label class="field"><strong>待考核姓名</strong><textarea id="roster-names" ${state.confirmed?'disabled':''}>${esc(state.names)}</textarea></label>${state.roster?`<div class="roster-results">${[['已匹配',state.roster.matched],['未匹配',state.roster.unmatched],['未纳入',experts.filter(e=>!state.roster.matched.includes(e))]].map(([title,names])=>`<div class="roster-result"><strong>${title}</strong><span>${names.length}人</span><span class="person">${esc(names.join('、')||'无')}</span></div>`).join('')}</div>`:''}<div class="roster-actions"><span class="status">${state.policy?'评分参数已读取并固定 · V0.9':'确认时自动读取并校验评分参数'}</span><button class="primary" data-action="confirm-roster" ${state.confirmed||state.scenario==='exception'&&!state.bound?'disabled':''}>${state.confirmed?'名单已确认':'确认名单并开始考核'}</button></div>${state.policy?receipt():''}</section>`}
function receipt(){return '<details class="receipt"><summary>评分参数已固定 · V0.9 · 查看读取凭据</summary><p>客观30分＋主观70分，阶段权重4∶2∶4。</p><p class="muted">配置快照仅用于此次模拟考核；正式版本以实际配置为准。</p><code>config/scoring-policy-v0.1.json · 模拟读取成功</code></details>'}
function match(){const names=[...new Set(state.names.split(/[\s、,，;；]+/).filter(Boolean))];state.roster={matched:names.filter(n=>experts.includes(n)),unmatched:names.filter(n=>!experts.includes(n))}}
function myList(){const done=experts.filter(e=>completed(e)).length;return `<div class="heading"><div class="inline-title"><h2>我的问卷</h2><span class="count-note">共 ${experts.length} 个评审人</span></div><span class="status">${done}／${experts.length} 已完成${done===experts.length?' · 全部完成':''}</span></div><div class="list">${experts.map(e=>{const p=answerProgress(e);return `<article class="assessment"><div class="row"><h3 class="person">${esc(e)}</h3><button class="primary" data-expert="${esc(e)}">${p.selected?'查看／修改问卷':'填写问卷'}</button></div><p class="status">${p.selected?'已保存':'待填写'} · ${p.valid}／6题${p.valid===6?' · 已完成':p.selected>p.valid?' · 待补依据或原因':''}</p></article>`}).join('')}</div>`}
function subjective(){return `<div class="heading"><div class="inline-title"><h2 class="person">${esc(state.expert)}</h2><span class="project-info"><button type="button" aria-label="查看共同项目" aria-expanded="false" aria-controls="common-projects" data-action="projects">!</button><span class="project-popover" id="common-projects" role="region" aria-label="共同项目列表"><strong>共同项目（${commonProjects().length}个）</strong><ul>${commonProjects().map(p=>`<li>${esc(p.name)}（${esc(p.code)}）</li>`).join('')}</ul></span></span></div><span class="status" id="save-status" aria-live="polite"></span></div>${state.user.role==='admin'?`<div class="review-top"><label for="review-manager">评价归属项目经理</label><select id="review-manager">${accounts.filter(u=>u.role==='project_manager').map(u=>`<option value="${esc(u.employee_id)}" ${state.manager===u.employee_id?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div>`:''}<div id="subjective-panel">${questionnairePolicy.dimensions.map((d,i)=>`<fieldset class="subjective-dimension" id="dimension-${d.id}">${dimensionMarkup(d,i)}</fieldset>`).join('')}<div class="subjective-footer"><span id="subjective-completion" aria-live="polite"></span><progress id="subjective-completion-bar" max="6" value="0" aria-label="问卷填答进度"></progress></div></div>${pager(state.user.role==='admin'?'back-list':'my-list',state.user.role==='admin'?'← 返回考核任务信息':'← 返回我的问卷')}`}
function dimensionMarkup(d,i){const r=currentRatings()[d.id];const options=[...d.options,...(d.id==='contribution'?[]:[{id:'unable',...questionnairePolicy.unable}])];return `<legend>${i+1}．${esc(d.title)}</legend><p class="subjective-question">${esc(d.prompt)}</p><p class="subjective-boundary">职责边界：${esc(d.boundary)}</p><div class="subjective-options">${options.map(o=>`<div class="subjective-option"><label for="${d.id}-${o.id}"><input type="radio" name="${d.id}" id="${d.id}-${o.id}" value="${o.id}" data-rating="${d.id}" ${r?.option===o.id?'checked':''}/><span><strong>${esc(o.title)}</strong><span class="subjective-description">${esc(o.description)}</span></span></label></div>`).join('')}</div>${r?.option==='unable'?`<div class="subjective-rating-tools"><label class="field"><span>原因（必填）</span><input data-reason="${d.id}" maxlength="500" value="${esc(r.reason||'')}" placeholder="${esc(questionnairePolicy.unable.reason_prompt)}"/></label></div>`:r&&requiresEvidence(d.id,r.option)?`<div class="subjective-rating-tools"><details class="subjective-evidence" open><summary>事实依据（必填）</summary><p>${d.id==='contribution'?esc(questionnairePolicy.contribution_prompt):'可关联多个共同项目或同项目的多次记录，以支持周期判断。'}</p>${r.evidence.map((e,j)=>`<div class="subjective-evidence-fields"><label class="field"><span>关联项目</span><select data-project="${d.id}" data-index="${j}"><option value="">关联项目</option>${commonProjects().map(p=>`<option value="${esc(p.code)}" ${e.project_code===p.code?'selected':''}>${esc(p.name)}（${esc(p.code)}）</option>`).join('')}</select></label><label class="field"><span>事实及证据位置（每条100字）</span><input data-note="${d.id}" data-index="${j}" maxlength="100" value="${esc(e.note)}"/></label><button type="button" data-remove-evidence="${d.id}" data-index="${j}">移除</button></div>`).join('')}<button type="button" data-add-evidence="${d.id}">增加依据</button></details></div>`:''}`}
function refreshDimension(id,focusId){const i=questionnairePolicy.dimensions.findIndex(d=>d.id===id);$('#dimension-'+id).innerHTML=dimensionMarkup(questionnairePolicy.dimensions[i],i);bindQuestionnaire($('#dimension-'+id));saveIndicator();if(focusId)document.getElementById(focusId)?.focus({preventScroll:true})}
function chooseRating(id,option){const old=currentRatings()[id];if(old?.option===option){delete currentRatings()[id]}else{currentRatings()[id]={option,reason:old?.reason||'',evidence:requiresEvidence(id,option)?(old?.evidence?.length?old.evidence:[{project_code:'',note:''}]):[]}}}
function bindQuestionnaire(root=$('#subjective-panel')){
 root.querySelectorAll('.subjective-option label').forEach(label=>label.onclick=event=>{event.preventDefault();const input=label.querySelector('input');chooseRating(input.name,input.value);refreshDimension(input.name,input.id)});
 root.querySelectorAll('[data-rating]').forEach(input=>input.onchange=()=>{if(currentRatings()[input.name]?.option!==input.value){chooseRating(input.name,input.value);refreshDimension(input.name,input.id)}});
 root.querySelectorAll('[data-reason]').forEach(input=>input.oninput=()=>{currentRatings()[input.dataset.reason].reason=input.value;saveIndicator()});
 root.querySelectorAll('[data-note]').forEach(input=>input.oninput=()=>{currentRatings()[input.dataset.note].evidence[Number(input.dataset.index)].note=input.value;saveIndicator()});
 root.querySelectorAll('[data-project]').forEach(input=>input.onchange=()=>{currentRatings()[input.dataset.project].evidence[Number(input.dataset.index)].project_code=input.value;saveIndicator()});
 root.querySelectorAll('[data-add-evidence]').forEach(button=>button.onclick=()=>{const id=button.dataset.addEvidence;currentRatings()[id].evidence.push({project_code:'',note:''});refreshDimension(id)});
 root.querySelectorAll('[data-remove-evidence]').forEach(button=>button.onclick=()=>{const id=button.dataset.removeEvidence;currentRatings()[id].evidence.splice(Number(button.dataset.index),1);refreshDimension(id)});
}
function objective(){return `<div class="heading"><div><p class="eyebrow">客观数据评价</p><h2>客观评分</h2><p class="muted">以下为演示数据，不调用AI或读取真实报告。</p></div><button class="primary" data-action="score">${state.objective?'重新模拟评分':'模拟自动评分'}</button></div><div class="metrics"><div class="metric"><span class="muted">报告数量</span><strong>2</strong></div><div class="metric"><span class="muted">考核评审人</span><strong>2</strong></div><div class="metric"><span class="muted">处理状态</span><strong style="font-size:22px">${state.objective?'已完成':'待计算'}</strong></div></div><div class="table-wrap"><table><thead><tr><th>评审人</th><th>基础得分</th><th>意见超额得分</th><th>有效对策得分</th><th>客观总得分</th></tr></thead><tbody>${experts.map((e,i)=>`<tr><td class="person">${e}</td><td>${state.objective?22-i:'—'}</td><td>${state.objective?2:'—'}</td><td>${state.objective?3:'—'}</td><td>${state.objective?27-i:'—'}</td></tr>`).join('')}</tbody></table></div>${receipt()}`}
function total(){return `<div class="heading"><div><p class="eyebrow">总分统计</p><h2>考核结果</h2><p class="muted">演示结果仅用于预览布局与权限。</p></div><button data-action="export">导出演示结果</button></div><div class="table-wrap"><table><thead><tr><th>评审人</th><th>客观得分</th><th>主观得分</th><th>结果状态</th></tr></thead><tbody>${experts.map((e,i)=>`<tr><td class="person">${e}</td><td>${state.objective?27-i:'待完成'}</td><td>${completed(e,'1001')?'58（演示）':'待填写'}</td><td>${state.objective&&completed(e,'1001')?'可确认（演示）':'暂定'}</td></tr>`).join('')}</tbody></table></div>`}
function download(name,value,type='application/json'){const url=URL.createObjectURL(new Blob([value],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.nav){goto(b.dataset.nav==='subjective'&&state.user.role!=='admin'?'my-list':b.dataset.nav);return}if(b.dataset.expert){state.expert=b.dataset.expert;goto('subjective');return}switch(b.dataset.action){
case 'switch':state.user=null;goto('login');break;
case 'password-eye':{const input=$('#login-password'),visible=input.type==='password';input.type=visible?'text':'password';b.innerHTML=eyeIcon(visible);b.setAttribute('aria-label',visible?'隐藏密码':'显示密码');b.setAttribute('aria-pressed',String(visible));break}
case 'projects':{const wrap=b.closest('.project-info');const opened=wrap.classList.toggle('pinned');b.setAttribute('aria-expanded',String(opened));if(!opened)b.blur();break}
case 'new':clearInterval(timer);state.scanning=false;state.scanned=false;state.confirmed=false;state.policy=false;state.roster=null;state.created=true;state.bound=false;goto('read');break;
case 'open-assessment':state.scanned=true;goto('read');break;
case 'back-list':goto('list');break;
case 'my-list':goto('my-list');break;
case 'history':goto('total');toast('正在查看历史演示结果');break;
case 'scan':state.scanning=true;state.percent=0;state.scanned=false;render();clearInterval(timer);timer=setInterval(()=>{state.percent+=25;if(state.percent>=100){clearInterval(timer);state.scanning=false;state.scanned=true;if(state.scenario==='normal')state.bound=true;if(state.page==='read')render()}else if(state.page==='read'){$('.scanbar>span').style.width=state.percent+'%';$('#scan-progress').textContent='正在读取 '+state.percent+'%'}},260);break;
case 'bind':{const u=accounts.find(u=>u.employee_id===$('#bind-account').value);if(!u){toast('请先选择对应账号');break}if(!u.owner_ids.includes('ou_demo_new'))u.owner_ids.push('ou_demo_new');state.bound=true;render();toast('已建立固定关联，2份报告一起完成匹配（演示）');break}
case 'sample-roster':state.names=experts.join('\n');match();render();toast('已导入示例名单');break;
case 'match':match();render();break;
case 'confirm-roster':match();if(!state.roster.matched.length){render();toast('至少需要一位匹配的评审人');break}state.policy=true;state.confirmed=true;goto('objective');toast('评分参数读取成功，名单与参数快照已固定（演示）');break;
case 'score':state.objective=true;render();toast('模拟客观评分完成');break;
case 'config':$('#config-json').value=JSON.stringify({version:1,users:accounts},null,2);$('#config-error').textContent='';$('#config-dialog').showModal();break;
case 'close-config':$('#config-dialog').close();break;
case 'save-config':try{const data=JSON.parse($('#config-json').value);const users=data.users;if(!Array.isArray(users)||!users.some(u=>u.enabled&&u.role==='admin'))throw Error('至少保留一个启用的管理员');if(new Set(users.map(u=>u.employee_id)).size!==users.length||users.some(u=>!u.name||typeof u.employee_id!=='string'||!['admin','project_manager'].includes(u.role)||!Array.isArray(u.owner_ids)))throw Error('请检查工号、姓名、角色及owner_ids');accounts=users;state.user=accounts.find(u=>u.employee_id===state.user.employee_id&&u.enabled);$('#config-dialog').close();if(!state.user)goto('login');else goto(state.user.role==='admin'?'list':'my-list');toast('已应用模拟账号配置')}catch(err){$('#config-error').textContent=err.message}break;
case 'backup':download('TDT模拟备份-draft-v2.json',JSON.stringify({draft:true,accounts,answers:state.answers},null,2));toast('已下载模拟数据备份');break;
case 'export':download('TDT模拟结果-draft-v2.csv','\ufeff评审人,结果状态\n虚拟评审人甲,演示结果\n虚拟评审人乙,演示结果','text/csv;charset=utf-8');break;
}});
render();
</script>
</body></html>
